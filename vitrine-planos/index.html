/* ============ Tokens (as cores do provedor são aplicadas pelo editor) ============ */
:root{
  --brand:#00AEE3;--brand2:#0A4C8B;--cta:#FF6A1A;--bg:#D9F5FF;
  --brand-rgb:0,174,227;--brand2-rgb:10,76,139;--cta-rgb:255,106,26;
  --on-brand:#fff;--on-cta:#fff;--price:#0A86C2;--soft:#E8F7FD;
  --veil:rgba(255,255,255,.10);--veil-line:rgba(255,255,255,.38);--veil-strong:rgba(0,0,0,.2);
  --ink:#0D2238;--ink2:#4B5E74;--page-ink:#0D2238;--line:#DCE6EE;--warn:#C81E3A;
  --gap:24px;--panel:0px;--bar:0px;--cols:3;
  --font:"Outfit",ui-rounded,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--page-ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:repeating-radial-gradient(circle at 100% 0,transparent 0 62px,rgba(var(--brand-rgb),.10) 62px 64px);
  -webkit-mask-image:radial-gradient(circle at 100% 0,#000 0,transparent 62%);mask-image:radial-gradient(circle at 100% 0,#000 0,transparent 62%)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
svg{display:block}
:focus-visible{outline:3px solid var(--cta);outline-offset:2px}
.noscript{padding:40px;text-align:center}

/* ============ Palco (a vitrine) ============ */
.stage{padding:var(--bar) var(--panel) 0 0;transition:padding .25s ease}
.wrap{max-width:1288px;margin:0 auto;padding:0 24px}
body.has-dock .stage{padding-bottom:132px}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0 8px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{display:block;max-height:52px;max-width:min(240px,46vw);object-fit:contain}
.brand__mark{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:var(--on-brand);background:linear-gradient(150deg,var(--brand),var(--brand2))}
.brand__mark svg{width:26px;height:26px}
.brand__name{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.05;overflow-wrap:anywhere}
.top__actions{display:flex;align-items:center;gap:8px;flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;border:1.5px solid rgba(var(--brand2-rgb),.28);background:rgba(255,255,255,.6);color:var(--ink);font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;white-space:nowrap}
.pill:hover{background:#fff}
.pill svg{width:18px;height:18px}
.pill--icon{width:42px;padding:0;justify-content:center}

.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:end;gap:12px 40px;padding:22px 0 26px}
.intro h1{font-size:clamp(30px,3.7vw,50px);font-weight:800;letter-spacing:-.04em;line-height:1.02;max-width:20ch;text-wrap:balance}
.intro p{font-size:clamp(16px,1.35vw,19px);font-weight:400;opacity:.8;max-width:38ch;justify-self:end;padding-bottom:4px}

/* trilho dos planos */
.plans{position:relative}
.plans__track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols));gap:var(--gap);justify-content:center;
  overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 12px;padding:22px 12px 44px;margin:0 -12px;scrollbar-width:thin}
.plans__track.is-overflowing{justify-content:start}
.plans__track[data-cols="1"]{grid-auto-flow:row;grid-auto-columns:auto;grid-template-columns:minmax(0,1fr);gap:34px;overflow:visible;justify-content:stretch}
.plans__nav{display:none;justify-content:center;gap:10px;margin-top:-22px;padding-bottom:22px}
.plans__nav.is-on{display:flex}
.plans__nav button{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(var(--brand2-rgb),.3);background:#fff;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.plans__nav button:hover{border-color:var(--brand2)}
.plans__nav svg{width:20px;height:20px}
.empty{margin:30px 0 60px;padding:44px 24px;border:2px dashed rgba(var(--brand2-rgb),.35);border-radius:28px;text-align:center;font-size:18px}

/* ============ Card do plano ============ */
.plan{position:relative;display:flex;flex-direction:column;min-width:0;container-type:inline-size;scroll-snap-align:start;
  border-radius:32px;color:var(--on-brand);background:linear-gradient(170deg,var(--brand) 0%,var(--brand2) 74%);
  box-shadow:0 26px 44px -26px rgba(var(--brand2-rgb),.7)}
.plan.has-badge{box-shadow:0 0 0 3px var(--cta),0 26px 44px -22px rgba(var(--brand2-rgb),.75)}
.is-intro .plan{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 90ms)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
.plan__badge{position:absolute;z-index:2;top:0;left:50%;transform:translate(-50%,-50%);max-width:calc(100% - 96px);padding:7px 18px;border-radius:999px;background:var(--cta);color:var(--on-cta);font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 14px -6px rgba(var(--cta-rgb),.9)}
.plan__edit{display:none;position:absolute;z-index:3;top:-14px;right:-8px;width:36px;height:36px;border-radius:50%;border:2px solid #fff;background:#111827;color:#fff;cursor:pointer;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.plan__edit svg{width:16px;height:16px}
body.is-editing .plan__edit{display:grid}

.plan__top{flex:1;display:flex;flex-direction:column;padding:26px 22px 20px}
.plan__name{font-size:16px;font-weight:600;opacity:.92;margin-bottom:8px;overflow-wrap:anywhere}
.plan__head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.speed{display:flex;flex-direction:column;min-width:0;font-weight:900}
.speed__num{font-size:86px;font-size:clamp(60px,25cqi,96px);line-height:.8;letter-spacing:-.05em;overflow-wrap:anywhere}
.speed__unit{margin-top:10px;font-size:22px;font-size:clamp(18px,6.4cqi,25px);font-weight:300;letter-spacing:.16em;text-transform:uppercase;line-height:1}
.tech{flex:none;display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:3px;padding-top:2px;max-width:46%}
.tech svg{width:34px;height:34px;margin-bottom:2px}
.tech b{font-size:23px;font-size:clamp(19px,6.6cqi,26px);font-weight:800;letter-spacing:-.03em;line-height:1}
.tech span{font-size:13px;font-weight:500;opacity:.92;line-height:1.15}

/* painel de escolha */
.chooser{margin-top:18px;padding:13px 10px 10px;border:1.5px solid var(--veil-line);border-radius:22px;background:var(--veil);transition:border-color .2s,background .2s}
.chooser + .chooser{margin-top:10px}
.chooser__head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 9px 6px}
.chooser__title{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:16px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.chooser__cat{font-size:20px;font-weight:800;letter-spacing:-.025em;line-height:1.05;overflow-wrap:anywhere}
.chooser__ask{font-size:13.5px;font-weight:500;letter-spacing:0;opacity:.92}
.count{flex:none;padding:5px 11px;border-radius:999px;background:var(--veil-strong);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;transition:background .2s,color .2s}
.count i{font-style:normal}
@container (max-width:345px){.count i{display:none}}
/* no celular cabem 4 aplicativos por linha: o ícone acompanha a largura da coluna */
@container (max-width:400px){
  .opts .opt{flex:0 0 calc((100% - 19px) / 4);width:auto;min-width:0;padding-left:1px;padding-right:1px}
  .opt .tile{width:100%;height:auto;aspect-ratio:4 / 3}
  .opt__name{font-size:12px}
}
.chooser.is-complete{border-color:#fff}
.chooser.is-complete .count{background:#fff;color:var(--ink)}
.chooser.is-missing{border-color:#FFD166;background:rgba(255,209,102,.16);animation:shake .4s}
.chooser.is-full .count{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-5px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.opt{position:relative;flex:0 0 78px;width:78px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 3px 9px;border-radius:17px;border:1.5px solid transparent;background:none;color:inherit;cursor:pointer;text-align:center;
  transition:background .18s,color .18s,border-color .18s,opacity .18s,transform .18s,box-shadow .18s;-webkit-tap-highlight-color:transparent}
.opt:hover{background:rgba(255,255,255,.14)}
.opt:active{transform:scale(.96)}
.opt[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:var(--cta);box-shadow:0 10px 18px -10px rgba(0,0,0,.55)}
.chooser.is-complete .opt[aria-pressed="false"]{opacity:.5}
.chooser.is-complete .opt[aria-pressed="false"]:hover{opacity:.85}
.opt__name{font-size:12.5px;font-weight:600;line-height:1.12;overflow-wrap:anywhere}
.opt__tag{font-size:10.5px;font-weight:500;line-height:1.1;opacity:.88;margin-top:-3px}
.opt__tag--extra{font-weight:700;opacity:1}
.opt__check{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;background:var(--check-bg,rgba(10,40,80,.45));display:grid;place-items:center;transition:background .18s,border-color .18s}
.opt__check svg{width:12px;height:12px;opacity:0;transform:scale(.3);transition:opacity .15s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.opt[aria-pressed="true"] .opt__check{background:var(--cta);border-color:var(--cta);color:var(--on-cta)}
.opt[aria-pressed="true"] .opt__check svg{opacity:1;transform:none}
.plan__note{margin-top:auto;padding:11px 6px 0;font-size:13px;line-height:1.3;opacity:.9;text-align:center}

/* ícone do aplicativo */
.tile{--t:48px;flex:none;width:calc(var(--t) * 4 / 3);height:var(--t);border-radius:calc(var(--t) * .25);background:var(--tb,#1F2937);color:var(--tf,#fff);display:grid;place-items:center;overflow:hidden;
  font-family:var(--font);font-weight:800;letter-spacing:-.03em;line-height:1;white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(128,128,128,.25),0 2px 5px rgba(0,0,0,.16)}
.tile img{width:100%;height:100%;object-fit:contain;display:block}

/* parte branca: incluídos, preço e botão */
.plan__sheet{flex:none;display:flex;flex-direction:column;margin:0 3px 3px;padding:16px 19px 18px;border-radius:26px 26px 29px 29px;background:#fff;color:var(--ink)}
.incl{padding:12px 14px 13px;border-radius:18px;background:var(--soft)}
.incl__label{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;margin-bottom:10px}
.incl__label svg{width:17px;height:17px;color:var(--price)}
.incl__list{display:flex;flex-wrap:wrap;gap:9px 14px}
.incl__list li{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;line-height:1.15}
.opt .tile{--t:50px}
.incl .tile{--t:34px}
.perks{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:12px;padding:0 4px;font-size:13.5px;color:var(--ink2)}
.perks li{display:flex;align-items:center;gap:6px}
.perks svg{width:14px;height:14px;color:var(--price);flex:none}
.price{display:flex;justify-content:center;align-items:flex-end;gap:7px;margin-top:auto;padding-top:20px;color:var(--price);line-height:1}
.price__pre{display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding-bottom:3px;font-size:21px;font-weight:300}
.price__pre b{font-size:25px;font-weight:800}
.price__int{font-size:78px;font-size:clamp(58px,22.5cqi,84px);font-weight:900;letter-spacing:-.05em;line-height:.78}
.price__post{display:flex;flex-direction:column;gap:6px;padding-bottom:3px;font-size:27px;font-weight:800}
.price__post small{font-size:18px;font-weight:300}
.plan__rule{height:1.5px;margin:16px 4px 0;background:rgba(var(--brand-rgb),.5);border:0}
.incl + .plan__rule,.perks + .plan__rule{margin-top:16px}
.plan__sheet > .plan__rule:first-child{display:none}
.cta{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:18px;padding:16px 20px;border:0;border-radius:999px;background:var(--cta);color:var(--on-cta);
  font-family:var(--font);font-size:18px;font-weight:700;line-height:1.1;cursor:pointer;text-decoration:none;box-shadow:0 12px 20px -12px rgba(var(--cta-rgb),1);transition:transform .15s,filter .15s}
.cta:hover{filter:brightness(1.07);transform:translateY(-1px)}
.cta:active{transform:translateY(1px)}
.cta svg{width:20px;height:20px}
.plan__hint{min-height:18px;margin-top:10px;text-align:center;font-size:13.5px;color:var(--ink2)}
.plan__hint.is-error{color:var(--warn);font-weight:700}
.plan__hint.is-ok{color:#0E7A4B;font-weight:600}
.plan__fine{margin-top:8px;text-align:center;font-size:12px;line-height:1.3;color:var(--ink2);overflow-wrap:anywhere}

.foot{padding:6px 0 34px;font-size:13px;line-height:1.45;opacity:.75;max-width:90ch}

/* ============ Resumo fixo ============ */
.dock{position:fixed;z-index:30;left:0;right:var(--panel);bottom:0;padding:0 12px 12px;pointer-events:none;transform:translateY(115%);transition:transform .35s cubic-bezier(.2,.8,.2,1),right .25s}
.dock.is-on{transform:none}
.dock__in{pointer-events:auto;max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:8px 18px;padding:12px 12px 12px 20px;border-radius:26px;background:var(--ink);color:#fff;box-shadow:0 18px 40px -12px rgba(0,0,0,.55)}
.dock__plan{flex:none;display:flex;flex-direction:column;line-height:1.1}
.dock__plan b{font-size:22px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.dock__plan span{font-size:12.5px;opacity:.75;max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock__mid{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px}
.dock__set{display:flex;align-items:center;gap:7px;min-width:0}
.dock__set > span{font-size:12px;opacity:.7;white-space:nowrap}
.dock__set ul{display:flex;gap:5px;flex-wrap:wrap}
.dock__set li{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;white-space:nowrap}
.dock .tile{--t:28px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.dock__set--incl li em{display:none}
.dock__todo{font-size:14px;font-weight:600;color:#FFD166}
.dock__price{flex:none;display:flex;align-items:baseline;gap:3px;font-size:24px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.dock__price small{font-size:13px;font-weight:400;opacity:.75;letter-spacing:0}
.dock .cta{width:auto;flex:none;margin:0;padding:13px 22px;font-size:16px}
.dock__clear{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:grid;place-items:center}
.dock__clear:hover{background:rgba(255,255,255,.24)}
.dock__clear svg{width:15px;height:15px}

/* ============ Janela de resumo ============ */
dialog.sum{width:min(540px,calc(100vw - 24px));max-height:calc(100dvh - 24px);padding:0;border:0;border-radius:30px;background:#fff;color:var(--ink);font-family:var(--font);box-shadow:0 30px 80px -20px rgba(0,0,0,.6);overflow:hidden}
dialog.sum[open]{display:flex;flex-direction:column;animation:pop .28s cubic-bezier(.2,.9,.3,1)}
dialog.sum::backdrop{background:rgba(8,20,36,.6)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.98)}}
.sum__hero{position:relative;flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:22px 24px 20px;color:var(--on-brand);background:linear-gradient(160deg,var(--brand),var(--brand2))}
.sum__hero h2{font-size:15px;font-weight:600;opacity:.92;margin-bottom:10px}
.sum__speed{font-size:54px;font-weight:900;letter-spacing:-.045em;line-height:.85}
.sum__speed small{font-size:19px;font-weight:300;letter-spacing:.14em;text-transform:uppercase;margin-left:8px}
.sum__planname{font-size:15px;font-weight:600;margin-top:8px;opacity:.95}
.sum__close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:0;background:var(--veil-strong);color:inherit;cursor:pointer;display:grid;place-items:center}
.sum__close svg{width:16px;height:16px}
.sum__tech{text-align:right;font-size:14px;font-weight:600;line-height:1.25;padding-right:2px}
.sum__body{flex:1;overflow:auto;padding:6px 24px 8px}
.sum__sec{padding:16px 0}
.sum__sec + .sum__sec{border-top:1px solid var(--line)}
.sum__sec h3{font-size:14px;font-weight:700;color:var(--ink2);margin-bottom:11px}
.sum__list{display:grid;gap:10px}
.sum__list li{display:flex;align-items:center;gap:11px;font-size:16px;font-weight:600;line-height:1.2}
.sum__list li small{display:block;font-size:12.5px;font-weight:500;color:var(--ink2)}
.sum__list .tile{--t:40px}
.sum__list--incl{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.sum__list--incl li{font-size:14.5px;font-weight:500}
.sum__list--incl .tile{--t:32px}
.sum__total{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:2px 0 14px}
.sum__total span{font-size:14px;font-weight:700;color:var(--ink2)}
.sum__total small{display:block;font-size:12.5px;font-weight:500;margin-top:3px}
.sum__total b{font-size:38px;font-weight:900;letter-spacing:-.04em;line-height:.9;color:var(--price);white-space:nowrap}
.sum__total b i{font-style:normal;font-size:16px;font-weight:400;letter-spacing:0}
.sum__foot{flex:none;padding:14px 24px 22px;border-top:1px solid var(--line)}
.sum__foot p{font-size:13.5px;line-height:1.35;color:var(--ink2);text-align:center;margin-bottom:12px}
.sum__btns{display:flex;gap:10px}
.sum__btns .cta{margin:0}
.btn-ghost{flex:none;padding:0 20px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-family:var(--font);font-size:16px;font-weight:600;cursor:pointer}
.btn-ghost:hover{border-color:var(--ink2)}

.toast{position:fixed;z-index:60;left:50%;bottom:24px;transform:translate(-50%,30px);max-width:calc(100vw - 32px);padding:12px 18px;border-radius:14px;background:#111827;color:#fff;font-size:14.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
.toast.is-on{opacity:1;transform:translate(-50%,0)}
body.has-dock .toast{bottom:124px}

/* ============ Modo de edição ============ */
.bar{display:none;position:fixed;z-index:50;top:0;left:0;right:0;height:54px;align-items:center;gap:10px;padding:0 14px;background:#111827;color:#fff;font-family:var(--ui);font-size:14px}
body.is-editing .bar{display:flex}
body.is-editing{--bar:54px}
.bar__title{font-weight:700;white-space:nowrap}
.bar__tag{padding:3px 9px;border-radius:6px;background:#FDE68A;color:#713F12;font-size:12px;font-weight:700;white-space:nowrap}
.bar__warn{color:#FCA5A5;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bar__sp{flex:1}
.ebtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 13px;border-radius:9px;border:1px solid #D1D5DB;background:#fff;color:#111827;font-family:var(--ui);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.ebtn:hover{background:#F3F4F6}
.ebtn svg{width:15px;height:15px;flex:none}
.ebtn--dark{background:transparent;border-color:#4B5563;color:#fff}
.ebtn--dark:hover{background:#1F2937}
.ebtn--pri{background:#2563EB;border-color:#2563EB;color:#fff}
.ebtn--pri:hover{background:#1D4ED8}
.ebtn--danger{color:#B91C1C}
.ebtn--sm{height:30px;padding:0 9px;font-size:12.5px}
.ebtn--ico{width:30px;height:30px;padding:0}
.ebtn[disabled]{opacity:.35;cursor:default}
.bar__toggle{display:none}

.ed{display:none;position:fixed;z-index:40;top:54px;right:0;bottom:0;width:380px;flex-direction:column;background:#F3F4F6;color:#111827;border-left:1px solid #D1D5DB;font-family:var(--ui);font-size:14px;line-height:1.35}
body.is-editing .ed{display:flex}
body.is-editing{--panel:380px}
.ed__tabs{flex:none;display:flex;background:#fff;border-bottom:1px solid #D1D5DB}
.ed__tabs button{flex:1;padding:12px 4px 10px;border:0;border-bottom:3px solid transparent;background:none;font-family:var(--ui);font-size:13.5px;font-weight:600;color:#6B7280;cursor:pointer}
.ed__tabs button[aria-selected="true"]{color:#1D4ED8;border-bottom-color:#2563EB}
.ed__body{flex:1;overflow-y:auto;padding:14px 14px 60px}
.ed__demo{margin-bottom:12px;padding:10px 12px;border-radius:10px;background:#FEF3C7;color:#713F12;font-size:13px}
.ed h3{font-size:13px;font-weight:700;margin:18px 0 8px;color:#374151}
.ed h3:first-child{margin-top:0}
.ed p.help{font-size:12.5px;color:#6B7280;margin:6px 0 0}
.box{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:flex-end}
.row > *{flex:1;min-width:0}
.row > .fx{flex:none}
.f{display:block;margin-bottom:10px}
.f > span{display:block;font-size:12.5px;font-weight:600;color:#374151;margin-bottom:4px}
.f small{display:block;font-size:12px;color:#6B7280;margin-top:4px}
.f input[type=text],.f input[type=tel],.f input[type=number],.f select,.f textarea,.sel{width:100%;height:36px;padding:0 10px;border:1px solid #D1D5DB;border-radius:8px;background:#fff;font-family:var(--ui);font-size:14px;color:#111827}
.f textarea{height:auto;min-height:64px;padding:8px 10px;resize:vertical;line-height:1.35}
.f input:focus,.f select:focus,.f textarea:focus,.sel:focus{outline:2px solid #2563EB;outline-offset:0;border-color:#2563EB}
.f input[type=color]{width:100%;height:36px;padding:2px;border:1px solid #D1D5DB;border-radius:8px;background:#fff;cursor:pointer}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;margin-bottom:10px}
.chk input{width:16px;height:16px;margin:0;accent-color:#2563EB}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.presets button{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 6px;border-radius:999px;border:1px solid #D1D5DB;background:#fff;font-family:var(--ui);font-size:12.5px;cursor:pointer}
.presets i{width:20px;height:20px;border-radius:50%;border:2px solid var(--c)}
.logo-prev{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo-prev__img{flex:none;width:120px;height:56px;border-radius:8px;border:1px dashed #9CA3AF;display:grid;place-items:center;font-size:12px;color:#6B7280;background:repeating-conic-gradient(#F3F4F6 0 25%,#fff 0 50%) 0 0/14px 14px}
.logo-prev__img img{max-width:108px;max-height:48px}
.logo-prev__btns{display:flex;flex-wrap:wrap;gap:6px}
input[type=file].hid{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.acc{background:#fff;border:1px solid #E5E7EB;border-radius:12px;margin-bottom:10px;overflow:hidden}
.acc.is-open{border-color:#93C5FD;box-shadow:0 0 0 2px #DBEAFE}
.acc__head{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 4px}
.acc__title{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:6px 6px;border:0;background:none;text-align:left;font-family:var(--ui);font-size:14px;font-weight:700;cursor:pointer;color:#111827}
.acc__label{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.acc__label span,.acc__label small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc__label small{font-size:12.5px;font-weight:500;color:#6B7280}
.acc__title svg{width:14px;height:14px;flex:none;transition:transform .15s;color:#6B7280}
.acc.is-open .acc__title svg{transform:rotate(90deg)}
.acc__body{padding:4px 12px 12px;border-top:1px solid #E5E7EB}
.tag-demo{flex:none;padding:2px 7px;border-radius:5px;background:#FDE68A;color:#713F12;font-size:11px;font-weight:700}
.grp{border:1px solid #E5E7EB;border-radius:10px;padding:10px;margin-bottom:10px;background:#F9FAFB}
.grp__head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-weight:700;font-size:13px}
.grp__prev{font-size:12.5px;color:#1D4ED8;font-weight:600;margin:-2px 0 10px}
.grp__warn{font-size:12.5px;color:#B45309;font-weight:600;margin:0 0 10px}
.optrow{background:#fff;border:1px solid #E5E7EB;border-radius:9px;padding:8px;margin-bottom:6px}
.optrow__top{display:flex;align-items:center;gap:8px}
.optrow__top b{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.optrow .tile,.approw .tile,.chip .tile{--t:30px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.25)}
.optrow__more{display:flex;align-items:center;gap:8px;margin-top:8px}
.optrow__more .chk{margin:0;flex:none;font-size:12.5px}
.optrow__more input[type=text]{flex:1;min-width:0;height:30px;padding:0 8px;border:1px solid #D1D5DB;border-radius:7px;font-family:var(--ui);font-size:12.5px}
.optrow__more input.w-s{flex:0 0 78px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 5px;border:1px solid #E5E7EB;border-radius:9px;background:#fff;font-size:13px;font-weight:600}
.chip button{width:22px;height:22px;border:0;border-radius:6px;background:#F3F4F6;cursor:pointer;display:grid;place-items:center;color:#6B7280}
.chip button svg{width:10px;height:10px}
.approw{display:grid;grid-template-columns:40px minmax(0,1fr) 30px;gap:8px;align-items:center;background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:8px;margin-bottom:6px}
.approw input[type=text]{width:100%;height:32px;padding:0 8px;border:1px solid #D1D5DB;border-radius:7px;font-family:var(--ui);font-size:13.5px}
.approw__more{grid-column:2 / -1;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.approw__more input[type=text]{width:74px}
.approw__more input[type=color]{width:34px;height:30px;padding:1px;border:1px solid #D1D5DB;border-radius:7px;background:#fff;cursor:pointer}
.approw__more small{font-size:11.5px;color:#6B7280;margin-left:auto}
.steps{padding-left:20px;margin:0;list-style:decimal;font-size:13px;color:#374151}
.steps li{margin-bottom:5px}

/* ============ Telas menores ============ */
@media (max-width:1099px){
  body.is-editing{--panel:0px}
  .ed{width:100%;border-left:0}
  body.is-editing.panel-closed .ed{display:none}
  .bar__toggle{display:inline-flex}
}
@media (max-width:720px){
  .wrap{padding:0 16px}
  .top{padding-top:14px}
  .brand__name{font-size:20px}
  .brand__mark{width:40px;height:40px;border-radius:13px}
  .pill span{display:none}
  .pill{width:42px;padding:0;justify-content:center}

.xl--use thead tr:last-child th:nth-child(5){width:132px}

.use__track{position:absolute;left:0;right:0;top:8px;height:8px;border-radius:4px;background:#cde2fb}
.use__seg{position:absolute;top:0;height:24px;min-width:3px;cursor:default;outline:none}
.use__seg i{position:absolute;left:0;right:2px;top:8px;height:8px;background:var(--c)}
.use__seg.is-first i{border-radius:4px 0 0 4px}

.fin__pdfwrap{position:relative;display:inline-flex}

.fin__pdf label{display:block;margin-bottom:6px;font-weight:700}
.fin__pdf input{display:block;width:100%;height:38px;margin:0;padding:0 10px;border:1px solid #D1D5DB;border-radius:8px;background:#fff;font-family:var(--ui);font-size:14px;color:#111827}

/* área fora da tela onde a aba Apresentação é desenhada em tamanho real para o PDF */
.bk-pdfhost{position:fixed;left:-30000px;top:0;pointer-events:none}
/* ---- disposição usada só para medir o PDF (folha A4 em pé, 719 px de largura útil); a classe entra e sai no mesmo instante ---- */
.fin--pdf .fin__grid{display:block!important;width:719px!important;max-width:none!important;margin:0!important;padding:0!important}
.fin--pdf .fin__col{display:block!important}
.fin--pdf .fin__sec{width:719px!important;margin:0!important}
.fin--pdf .xlw{overflow:visible!important}
.fin--pdf .xl{--px:7px!important;width:100%!important;font-size:12px!important}
.fin--pdf .xl caption{padding:5px 8px!important;font-size:12.5px!important;white-space:nowrap!important}
.fin--pdf .xl th,.fin--pdf .xl td,.fin--pdf .xl input,.fin--pdf .xl select{height:22px!important}
.fin--pdf .xl thead th,.fin--pdf .xl tbody th,.fin--pdf .xl td.o,.fin--pdf .xl td.c,.fin--pdf .xl tr.sub th,.fin--pdf .xl tr.sub td{padding-top:2px!important;padding-bottom:2px!important}
.fin--pdf .xl thead th{white-space:normal!important}
.fin--pdf .xl tbody th,.fin--pdf .xl tr.sub th,.fin--pdf .xl tr.sub td,.fin--pdf .xl td.o{white-space:nowrap!important}
.fin--pdf .xl td.in,.fin--pdf .xl td.is-over{background:#fff!important}
.fin--pdf .xl--sched tbody tr:nth-child(even) td.is-over{background:#EEF3FB!important}
.fin--pdf .xl td.in input,.fin--pdf .xl td.in select,.fin--pdf .xl td.is-over input{color:#1B2433!important}
.fin--pdf .xl th.hin input,.fin--pdf .xl td.lbl input{min-width:0!important}
.fin--pdf .xl td.lbl input{padding-right:var(--px)!important}
.fin--pdf .xl .rm{display:none!important}
/* quadro 7 no PDF: o que é desenho sai; a parte do crédito ("47% do crédito") também, porque no PDF ela vai resumida
   na mesma linha do valor ("R$ 1.399,50 (47%)", em data-pdf) e não deve alargar a coluna na medição */
.fin--pdf .use__cost,.fin--pdf .use__apps,.fin--pdf .use__sw,.fin--pdf .use__bar,.fin--pdf .use__note,.fin--pdf .use__of,.fin--pdf .use__pct,.fin--pdf .use__share{display:none!important}
.fin--pdf .xl .use__meter td{height:34px!important;padding:2px var(--px)!important;font-size:12px!important}
.fin--pdf .use__big{font-size:12px!important;font-weight:400!important}
.fin--pdf .xl tbody th.use__cat{padding:2px var(--px)!important;white-space:normal!important}
/* o quadro 7 tem texto que quebra em linhas (nomes dos aplicativos): na medição ele usa uma fonte com as mesmas larguras
   da Helvetica do PDF (Arial e Liberation Sans são equivalentes), para a altura de cada linha bater com o texto impresso */
.fin--pdf .xl--use,.fin--pdf .xl--use caption,.fin--pdf .xl--use th,.fin--pdf .xl--use td,.fin--pdf .xl--use input{font-family:Arial,Helvetica,"Liberation Sans",sans-serif!important;letter-spacing:0!important}
/* colunas de número só com a largura do que vai impresso; o resto fica para os nomes dos aplicativos (menos linhas, quadro mais baixo) */
.fin--pdf .xl--use thead tr:last-child th:nth-child(2),.fin--pdf .xl--use thead tr:last-child th:nth-child(3){width:72px!important}
.fin--pdf .xl--use thead tr:last-child th:nth-child(4){width:126px!important}
.fin--pdf .xl--use thead tr:last-child th:nth-child(5){width:124px!important}
.fin--pdf .use__name,.fin--pdf .use__names{display:inline!important;font-size:12px!important;font-weight:400!important}
.fin--pdf .use__names{padding-left:8px!important}
.fin--pdf .xl--use thead th:first-child{min-width:0!important}
@media (hover:none){.xl .rm{opacity:.7}}

 => n === 1 ? one : many;\nconst listText = a => a.length \u003c= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1];\nconst round2 = n => Math.round(n * 100) / 100;\nconst q = id => CSS.escape(id);\n\nconst svg = (d, extra) => '\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"' + (extra || '') + '>' + d + '\u003c/svg>';\nconst ICON = {\n  wifi: svg('\u003cpath d=\"M2.5 9.2a14 14 0 0 1 19 0\"/>\u003cpath d=\"M5.8 12.7a9.3 9.3 0 0 1 12.4 0\"/>\u003cpath d=\"M9 16.1a4.6 4.6 0 0 1 6 0\"/>\u003ccircle cx=\"12\" cy=\"19.4\" r=\"1.1\" fill=\"currentColor\" stroke=\"none\"/>'),\n  check: svg('\u003cpath d=\"M5 12.5l4.5 4.5L19 7.5\"/>', ' stroke-width=\"3\"'),\n  seal: svg('\u003ccircle cx=\"12\" cy=\"12\" r=\"9.5\"/>\u003cpath d=\"M7.8 12.3l2.9 2.9 5.5-5.9\"/>'),\n  chat: svg('\u003cpath d=\"M20.5 11.6a8.5 8.5 0 0 1-12.6 7.5L3.5 20.5l1.4-4.2A8.5 8.5 0 1 1 20.5 11.6z\"/>'),\n  pencil: svg('\u003cpath d=\"M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3z\"/>\u003cpath d=\"M14.5 7.5l3 3\"/>'),\n  close: svg('\u003cpath d=\"M5 5l14 14M19 5L5 19\"/>', ' stroke-width=\"2.6\"'),\n  right: svg('\u003cpath d=\"M9.5 5.5L16 12l-6.5 6.5\"/>'),\n  up: svg('\u003cpath d=\"M6 14.5l6-6 6 6\"/>'),\n  down: svg('\u003cpath d=\"M6 9.5l6 6 6-6\"/>'),\n  trash: svg('\u003cpath d=\"M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 12.5h9l1-12.5\"/>'),\n  copy: svg('\u003crect x=\"8.5\" y=\"8.5\" width=\"11\" height=\"11\" rx=\"2\"/>\u003cpath d=\"M15.5 5.5v-1h-11v11h1\"/>'),\n  plus: svg('\u003cpath d=\"M12 5v14M5 12h14\"/>'),\n  eye: svg('\u003cpath d=\"M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"3\"/>'),\n  download: svg('\u003cpath d=\"M12 4v11M7 10.5l5 5 5-5M5 19.5h14\"/>')\n};\n\n/* ---------- dados ---------- */\nconst PRESETS = [\n  { name: 'Azul fibra', brand: '#00AEE3', brand2: '#0A4C8B', cta: '#FF6A1A', bg: '#D9F5FF .meta.version = 2;\n  }\n  return d;\n}\nconst EMBEDDED = migrate(normalize(JSON.parse(document.getElementById('combo-data').textContent)));\nconst DRAFT_KEY = 'monte-seu-combo:' + EMBEDDED.meta.docId;\nfunction loadDraft() {\n  try {\n    const raw = localStorage.getItem(DRAFT_KEY);\n    return raw ? migrate(normalize(JSON.parse(raw))) : null;\n  } catch (e) { return null; }\n}\nlet state = loadDraft() || clone(EMBEDDED);\nlet draftFailed = false;\nlet draftTimer = 0;\nfunction saveDraftSoon() {\n  clearTimeout(draftTimer);\n  draftTimer = setTimeout(() => {\n    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); draftFailed = false; }\n    catch (e) { draftFailed = true; }\n    const w = $('.bar__warn');\n    if (w) w.textContent = draftFailed ? 'Rascunho grande demais para salvar neste navegador. Exporte o HTML para não perder as alterações.' : '';\n  }, 350);\n}\n\n/* ---------- estado da tela (não é exportado) ---------- */\nconst ui = {\n  editing: false, panelOpen: true, tab: 'provider', openNet: null, openCat: null, appFilter: '',\n  net: null,     // internet escolhida (id)\n  cats: {},      // categorias adicionadas: cats[catId] = true\n  sel: {},       // aplicativos escolhidos: sel[catId] = [appId, ...]\n  error: '', lastTotal: null, first: true, exportName: ''\n};\nfunction resetChoices() {\n  ui.net = null; ui.cats = {}; ui.sel = {}; ui.error = '';\n  state.cats.forEach(c => { if (c.startAdded) addCat(c); });\n}\n\n/* ---------- regras ---------- */\nconst appById = id => state.apps.find(a => a.id === id);\nconst netById = id => state.nets.find(n => n.id === id);\nconst catById = id => state.cats.find(c => c.id === id);\nconst validOptions = c => c.options.filter(o => appById(o.appId));\nconst catLimit = c => Math.min(c.limit, validOptions(c).length);\nconst selOf = id => ui.sel[id] || (ui.sel[id] = []);\nconst addedCats = () => state.cats.filter(c => ui.cats[c.id]);\nconst perksOf = n => [n.install].concat(String(n.perks || '').split('\\n')).map(s => String(s || '').trim()).filter(Boolean);\n\nfunction addCat(c) {\n  ui.cats[c.id] = true;\n  // sem alternativa (opções \u003c= escolhas liberadas): os aplicativos entram sozinhos\n  const opts = validOptions(c);\n  if (opts.length && opts.length \u003c= c.limit) {\n    ui.sel[c.id] = opts.map(o => o.appId).filter(a => !addedCats().some(o => o.id !== c.id && selOf(o.id).indexOf(a) >= 0));\n  }\n}\nfunction status() {\n  const net = (ui.net && netById(ui.net)) || null;\n  const cats = addedCats().map(c => {\n    const chosen = selOf(c.id).map(id => ({ app: appById(id), opt: c.options.find(o => o.appId === id) })).filter(x => x.app && x.opt);\n    const limit = catLimit(c);\n    return { c, chosen, limit, missing: Math.max(0, limit - chosen.length) };\n  });\n  const missing = cats.reduce((n, x) => n + x.missing, 0);\n  const apps = cats.reduce((n, x) => n + x.chosen.length, 0);\n  const total = round2((net ? net.price : 0) + cats.reduce((s, x) => s + x.c.price, 0));\n  return { net, cats, missing, apps, total, complete: !!net && cats.length > 0 && missing === 0 };\n}\n/* o que ainda falta para o combo ficar completo (null = completo) */\nfunction need(st) {\n  if (!st.net) return { msg: 'Escolha a internet para começar', sel: '#sec-net' };\n  if (!st.cats.length) return { msg: 'Adicione pelo menos uma categoria', sel: '#sec-cat' };\n  if (st.missing) {\n    const m = st.cats.filter(x => x.missing);\n    return { msg: 'Falta escolher ' + st.missing + ' ' + plural(st.missing, 'aplicativo', 'aplicativos') + ' em ' + listText(m.map(x => x.c.name)), sel: '.cat[data-cat=\"' + q(m[0].c.id) + '\"]' };\n  }\n  return null;\n}\nfunction sanitize() {\n  if (ui.net && !netById(ui.net)) ui.net = null;\n  Object.keys(ui.cats).forEach(id => { if (!catById(id)) delete ui.cats[id]; });\n  Object.keys(ui.sel).forEach(id => {\n    const c = catById(id);\n    if (!c || !ui.cats[id]) { delete ui.sel[id]; return; }\n    const ok = validOptions(c).map(o => o.appId);\n    ui.sel[id] = ui.sel[id].filter(a => ok.indexOf(a) >= 0).slice(0, catLimit(c));\n  });\n}\n\n/* ---------- formatação ---------- */\nconst money = n => (Number(n) || 0).toFixed(2).replace('.', ',').replace(/\\B(?=(\\d{3})+(?!\\d))/g, '.');\nconst parseMoney = s => {\n  s = String(s).replace(/[^\\d.,]/g, '');\n  if (s.indexOf(',') >= 0) s = s.replace(/\\./g, '').replace(',', '.');\n  return Math.max(0, parseFloat(s) || 0);\n};\nconst speedText = n => (String(n.speed || '').trim() + ' ' + String(n.unit || '').trim()).trim();\nconst askText = c => { const n = catLimit(c) || c.limit; return 'Escolha ' + n + ' ' + plural(n, 'aplicativo', 'aplicativos'); };\nconst addText = p => p > 0 ? '+ R$ ' + money(p) : 'Sem adicional';\nconst optionTags = o => [o.ads ? 'Com anúncios' : '', (o.variant || '').trim()].filter(Boolean);\nconst waNumber = () => {\n  let d = String(state.provider.whatsapp || '').replace(/\\D/g, '');\n  if (d.length === 10 || d.length === 11) d = '55' + d;\n  return d.length >= 12 && d.length \u003c= 15 ? d : '';\n};\nconst slug = s => String(s || '').normalize('NFD').replace(COMBINING, '').toLowerCase().replace(/[^a-z0-9_]+/g, '-').replace(/^-|-$/g, '') || 'provedor';\n\n/* ---------- cores ---------- */\nfunction rgb(hex) {\n  let h = String(hex || '').replace('#', '');\n  if (h.length === 3) h = h.split('').map(c => c + c).join('');\n  const n = parseInt(h, 16);\n  return h.length !== 6 || isNaN(n) ? [0, 0, 0] : [n >> 16 & 255, n >> 8 & 255, n & 255];\n}\nconst lum = c => { const f = v => { v /= 255; return v \u003c= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(c[0]) + .7152 * f(c[1]) + .0722 * f(c[2]); };\nconst contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };\nconst WHITE = [255, 255, 255];\nconst mixc = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));\nconst hex = c => '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');\nconst inkOn = h => contrast(rgb(h), WHITE) >= 2.2 ? '#ffffff' : '#0D2238';\n\nfunction applyTheme() {\n  const c = state.provider.colors, st = document.documentElement.style;\n  const b = rgb(c.brand), b2 = rgb(c.brand2), ct = rgb(c.cta);\n  const lightText = contrast(mixc(b, b2, .45), WHITE) >= 2.2;\n  const fg = lightText ? '#ffffff' : '#0D2238';\n  const set = (k, v) => st.setProperty(k, v);\n  set('--brand', c.brand); set('--brand2', c.brand2); set('--cta', c.cta); set('--bg', c.bg);\n  set('--brand-rgb', b.join(',')); set('--brand2-rgb', b2.join(',')); set('--cta-rgb', ct.join(','));\n  set('--on-brand', fg);\n  set('--on-cta', inkOn(c.cta));\n  set('--veil', lightText ? 'rgba(255,255,255,.10)' : 'rgba(255,255,255,.35)');\n  set('--veil-line', lightText ? 'rgba(255,255,255,.38)' : 'rgba(13,34,56,.32)');\n  set('--veil-strong', lightText ? 'rgba(0,0,0,.2)' : 'rgba(13,34,56,.14)');\n  set('--sw-off', lightText ? 'rgba(255,255,255,.34)' : 'rgba(13,34,56,.26)');\n  set('--price', contrast(b, WHITE) >= 2.3 ? c.brand : contrast(b2, WHITE) >= 2.3 ? c.brand2 : '#0D2238');\n  set('--soft', hex(mixc(b, WHITE, .9)));\n  set('--page-ink', inkOn(c.bg) === '#ffffff' ? '#ffffff' : '#0D2238');\n  document.title = 'Monte seu combo' + (state.provider.name ? ' | ' + state.provider.name : '');\n  let link = $('link[rel=\"icon\"]');\n  if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }\n  link.href = 'data:image/svg+xml,' + encodeURIComponent('\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\">\u003crect width=\"32\" height=\"32\" rx=\"9\" fill=\"' + c.brand + '\"/>\u003cg fill=\"none\" stroke=\"' + fg + '\" stroke-width=\"2.6\" stroke-linecap=\"round\">\u003cpath d=\"M7 13.5a13 13 0 0 1 18 0\"/>\u003cpath d=\"M11 18a7.5 7.5 0 0 1 10 0\"/>\u003c/g>\u003ccircle cx=\"16\" cy=\"22.5\" r=\"2\" fill=\"' + fg + '\"/>\u003c/svg>');\n}\n\n/* ---------- blocos visuais ---------- */\nfunction autoShort(name) {\n  name = String(name || '').trim();\n  if (!name) return '?';\n  const words = name.split(/\\s+/);\n  if (words[0].length \u003c= 5) return words[0];\n  if (words.length > 1) return words.slice(0, 3).map(w => w[0]).join('').toUpperCase();\n  return name.slice(0, 2) + (/\\+$/.test(name) ? '+' : '');\n}\nfunction tileHTML(a, title) {\n  if (!a) return '';\n  const bg = a.bg || '#1F2937', tt = title ? ' title=\"' + esc(title) + '\"' : '';\n  if (a.logo) return '\u003cspan class=\"tile\" style=\"--tb:' + esc(bg) + '\"' + tt + '>\u003cimg src=\"' + esc(a.logo) + '\" alt=\"\">\u003c/span>';\n  const t = (a.short || '').trim() || autoShort(a.name);\n  const k = [.5, .5, .42, .34, .29, .24][Math.min(t.length, 6) - 1] || .2;\n  const fg = contrast(rgb(bg), WHITE) >= 1.9 ? '#fff' : '#0D2238';\n  return '\u003cspan class=\"tile\" style=\"--tb:' + esc(bg) + ';--tf:' + fg + ';font-size:calc(var(--t) * ' + k + ')\"' + tt + ' aria-hidden=\"true\">' + esc(t) + '\u003c/span>';\n}\nfunction netHTML(n, i) {\n  const incl = n.included.map(appById).filter(Boolean), perks = perksOf(n), p = money(n.price).split(',');\n  return '\u003cdiv class=\"netw\" style=\"--i:' + i + '\">' +\n    (n.badge ? '\u003cp class=\"badge\">' + esc(n.badge) + '\u003c/p>' : '') +\n    '\u003cbutton type=\"button\" class=\"edit\" data-act=\"edit-net\" data-id=\"' + esc(n.id) + '\" title=\"Editar esta internet\" aria-label=\"Editar esta internet\">' + ICON.pencil + '\u003c/button>' +\n    '\u003cbutton type=\"button\" class=\"net\" role=\"radio\" aria-checked=\"false\" data-act=\"net\" data-id=\"' + esc(n.id) + '\" aria-label=\"' + esc('Internet ' + speedText(n) + ', R$ ' + money(n.price) + ' por mês') + '\">' +\n      '\u003cspan class=\"net__top\">' + (n.name ? '\u003cspan class=\"net__name\">' + esc(n.name) + '\u003c/span>' : '') +\n        '\u003cspan class=\"net__head\">\u003cspan class=\"speed\">\u003cspan class=\"speed__num\">' + esc(n.speed) + '\u003c/span>\u003cspan class=\"speed__unit\">' + esc(n.unit) + '\u003c/span>\u003c/span>' +\n        (n.wifi || n.tech ? '\u003cspan class=\"tech\">' + ICON.wifi + (n.wifi ? '\u003cb>' + esc(n.wifi) + '\u003c/b>' : '') + (n.tech ? '\u003cspan>' + esc(n.tech) + '\u003c/span>' : '') + '\u003c/span>' : '') +\n      '\u003c/span>\u003c/span>' +\n      '\u003cspan class=\"net__sheet\">' +\n        (incl.length ? '\u003cspan class=\"net__incl\">' + ICON.seal + '\u003cspan class=\"net__incl-l\">Já incluídos\u003c/span>\u003cspan class=\"net__incl-s\">Inclui\u003c/span>' + incl.map(a => tileHTML(a, a.name)).join('') + '\u003c/span>' : '') +\n        (perks.length ? '\u003cspan class=\"net__perks\">' + perks.map(t => '\u003cspan>' + ICON.check + esc(t) + '\u003c/span>').join('') + '\u003c/span>' : '') +\n        '\u003cspan class=\"net__foot\">\u003cspan class=\"net__price\">\u003cspan class=\"rs\">R$\u003c/span>' + p[0] + '\u003cspan class=\"cents\">,' + p[1] + '\u003c/span>\u003csmall>/mês\u003c/small>\u003c/span>' +\n        '\u003cspan class=\"net__pick\">\u003cspan class=\"sw\">\u003c/span>\u003cspan class=\"net__picktxt\">Escolher\u003c/span>\u003c/span>\u003c/span>' +\n        (n.fine ? '\u003cspan class=\"net__fine\">' + esc(n.fine) + '\u003c/span>' : '') +\n      '\u003c/span>\u003c/button>\u003c/div>';\n}\nfunction catHTML(c, i) {\n  const opts = validOptions(c);\n  return '\u003carticle class=\"cat\" data-cat=\"' + esc(c.id) + '\" style=\"--i:' + (i + 3) + '\" aria-label=\"Categoria ' + esc(c.name) + '\">' +\n    '\u003cbutton type=\"button\" class=\"edit\" data-act=\"edit-cat\" data-id=\"' + esc(c.id) + '\" title=\"Editar esta categoria\" aria-label=\"Editar esta categoria\">' + ICON.pencil + '\u003c/button>' +\n    '\u003cheader class=\"cat__head\">\u003ch3 class=\"cat__name\">' + esc(c.name) + '\u003c/h3>' +\n      (c.price > 0 ? '\u003cp class=\"cat__price\" aria-label=\"Mais R$ ' + money(c.price) + ' por mês\">\u003cspan>+ R$\u003c/span>' + money(c.price) + '\u003csmall>/mês\u003c/small>\u003c/p>'\n                   : '\u003cp class=\"cat__price cat__price--free\">Sem adicional\u003c/p>') + '\u003c/header>' +\n    (opts.length\n      ? '\u003cdiv class=\"cat__rule\">\u003cp class=\"cat__ask\">' + esc(askText(c)) + '\u003c/p>\u003cspan class=\"count\" aria-live=\"polite\">\u003c/span>\u003c/div>' +\n        '\u003cdiv class=\"cat__panel\">\u003cdiv class=\"apps\" role=\"group\" aria-label=\"Aplicativos da categoria ' + esc(c.name) + '\">' + opts.map(o => {\n          const a = appById(o.appId), tags = optionTags(o);\n          return '\u003cbutton type=\"button\" class=\"app\" role=\"switch\" aria-checked=\"false\" data-act=\"app\" data-cat=\"' + esc(c.id) + '\" data-app=\"' + esc(a.id) + '\" title=\"' + esc(a.name) + '\" aria-label=\"' + esc([a.name].concat(tags).join(', ')) + '\">' +\n            tileHTML(a) + tags.map(t => '\u003cspan class=\"app__tag\">' + esc(t) + '\u003c/span>').join('') + '\u003cspan class=\"sw\">\u003c/span>\u003c/button>';\n        }).join('') + '\u003c/div>\u003c/div>'\n      : '\u003cp class=\"cat__empty\">Nenhum aplicativo cadastrado nesta categoria.\u003c/p>') +\n    '\u003cbutton type=\"button\" class=\"cat__add\" role=\"switch\" aria-checked=\"false\" data-act=\"cat\" data-id=\"' + esc(c.id) + '\">\u003cspan class=\"sw sw--lg\">\u003c/span>\u003cspan class=\"cat__addtxt\">Adicionar ao meu combo\u003c/span>\u003c/button>' +\n  '\u003c/article>';\n}\n\n/* ---------- resumo (coluna lateral, rodapé e janela) ---------- */\nfunction sumHero(st) {\n  return st.net\n    ? '\u003cdiv class=\"sumh__net\">\u003cdiv>\u003cp class=\"sumh__speed\">' + esc(st.net.speed) + '\u003csmall>' + esc(st.net.unit) + '\u003c/small>\u003c/p>' +\n      '\u003cp class=\"sumh__name\">' + esc([st.net.name, st.net.wifi, st.net.tech].filter(Boolean).join(', ')) + '\u003c/p>\u003c/div>\u003cp class=\"sumh__price\">R$ ' + money(st.net.price) + '\u003c/p>\u003c/div>'\n    : '\u003cp class=\"sumh__empty\">Escolha a internet\u003c/p>';\n}\nfunction sumBody(st, removable) {\n  const incl = st.net ? st.net.included.map(appById).filter(Boolean) : [];\n  const perks = st.net ? perksOf(st.net) : [];\n  return (st.cats.length ? '\u003cul class=\"sumcats\">' + st.cats.map(x =>\n      '\u003cli>\u003cdiv class=\"sumcat__top\">\u003cb>' + esc(x.c.name) + '\u003c/b>\u003cspan>' + addText(x.c.price) + '\u003c/span>' +\n        (removable ? '\u003cbutton type=\"button\" class=\"sumcat__x\" data-act=\"cat\" data-id=\"' + esc(x.c.id) + '\" aria-label=\"Remover ' + esc(x.c.name) + ' do combo\" title=\"Remover do combo\">' + ICON.close + '\u003c/button>' : '') + '\u003c/div>' +\n      (x.chosen.length ? '\u003cul class=\"sumapps\">' + x.chosen.map(ch => '\u003cli>' + tileHTML(ch.app) + '\u003cspan>' + esc(ch.app.name) +\n        (optionTags(ch.opt).length ? '\u003csmall>' + esc(optionTags(ch.opt).join(', ')) + '\u003c/small>' : '') + '\u003c/span>\u003c/li>').join('') + '\u003c/ul>' : '') +\n      (x.missing ? '\u003cp class=\"sumcat__todo\">Falta escolher ' + x.missing + ' ' + plural(x.missing, 'aplicativo', 'aplicativos') + '\u003c/p>' : '') + '\u003c/li>').join('') + '\u003c/ul>'\n    : '\u003cp class=\"sum__none\">Nenhuma categoria adicionada ainda.\u003c/p>') +\n    (incl.length || perks.length ? '\u003cdiv class=\"sumfix\">\u003ch3>' + ICON.seal + 'Já incluídos, sem escolher\u003c/h3>' +\n      (incl.length ? '\u003cul class=\"sumapps sumapps--fix\">' + incl.map(a => '\u003cli>' + tileHTML(a) + '\u003cspan>' + esc(a.name) + '\u003c/span>\u003c/li>').join('') + '\u003c/ul>' : '') +\n      (perks.length ? '\u003cul class=\"perks\">' + perks.map(t => '\u003cli>' + ICON.check + esc(t) + '\u003c/li>').join('') + '\u003c/ul>' : '') + '\u003c/div>' : '');\n}\nconst countText = st => st.apps ? st.apps + ' ' + plural(st.apps, 'aplicativo escolhido', 'aplicativos escolhidos') : 'Nenhum aplicativo escolhido';\nfunction totalHTML(st, bump) {\n  return '\u003cp class=\"sumf__count\">' + countText(st) + '\u003c/p>\u003cdiv class=\"sumf__total\">\u003cspan>Total mensal\u003c/span>\u003cb' + (bump ? ' class=\"is-bump\"' : '') + '>R$ ' + money(st.total) + '\u003ci>/mês\u003c/i>\u003c/b>\u003c/div>';\n}\nfunction summaryText(st) {\n  const lines = ['Olá! Montei este combo' + (state.provider.name ? ' na ' + state.provider.name : '') + ':', ''];\n  lines.push('*Internet:* ' + [st.net.name, speedText(st.net)].filter(Boolean).join(' - ') + ' (R$ ' + money(st.net.price) + ')');\n  lines.push('*Categorias e aplicativos:*');\n  st.cats.forEach(x => lines.push('- ' + x.c.name + ' (' + addText(x.c.price) + '): ' +\n    (x.chosen.map(ch => ch.app.name + (optionTags(ch.opt).length ? ' (' + optionTags(ch.opt).join(', ') + ')' : '')).join(', ') || 'sem aplicativo')));\n  const fix = st.net.included.map(appById).filter(Boolean).map(a => a.name).concat(perksOf(st.net));\n  if (fix.length) lines.push('*Já incluídos:* ' + fix.join(', '));\n  lines.push('*Aplicativos escolhidos:* ' + st.apps);\n  lines.push('*Total mensal:* R$ ' + money(st.total));\n  return lines.join('\\n');\n}\n\n/* ---------- montagem da página ---------- */\nconst root = document.getElementById('app');\nroot.innerHTML =\n  '\u003cdiv class=\"bar\" role=\"toolbar\" aria-label=\"Modo de edição\">\u003c/div>' +\n  '\u003cmain class=\"stage\">\u003cdiv class=\"wrap\" id=\"stage\">\u003c/div>\u003c/main>' +\n  '\u003caside class=\"ed\" aria-label=\"Editor do combo\">\u003cdiv class=\"ed__tabs\" role=\"tablist\">\u003c/div>\u003cdiv class=\"ed__body\">\u003c/div>\u003c/aside>' +\n  '\u003cdiv class=\"dock\">\u003c/div>' +\n  '\u003cdialog class=\"sum\" aria-label=\"Resumo do seu combo\">\u003c/dialog>' +\n  '\u003cdiv class=\"toast\" role=\"status\">\u003c/div>';\nconst stageEl = $('#stage'), barEl = $('.bar'), edTabs = $('.ed__tabs'), edBody = $('.ed__body'), dockEl = $('.dock'), sumEl = $('.sum'), toastEl = $('.toast');\n\nfunction renderStage() {\n  const p = state.provider, wa = waNumber();\n  stageEl.className = 'wrap' + (ui.first ? ' is-intro' : '');\n  stageEl.innerHTML =\n    '\u003cheader class=\"top\">\u003 =\"empty\">Nenhuma categoria cadastrada. Abra o Modo de edição e adicione a primeira.\u003c/p>') + '\u003c/section>' +\n      (p.footer ? '\u003cfooter class=\"foot\">' + esc(p.footer) + '\u003c/footer>' : '') +\n    '\u003c/div>\u003caside class=\"side\" aria-label=\"Resumo do combo\">\u003cdiv class=\"sumcard\" id=\"sum-side\">\u003c/div>\u003c/aside>\u003c/div>';\n  ui.first = false;\n  layout();\n  sync();\n}\n/* coluna lateral só quando cabe ao lado da grade 2×2; senão o resumo vai para o rodapé fixo */\nfunction layout() {\n  const lay = $('.layout');\n  if (!lay) return;\n  const w = stageEl.clientWidth - 2 * (parseFloat(getComputedStyle(stageEl).paddingLeft) || 0);\n  const side = w >= 1064;\n  lay.dataset.side = side ? '1' : '0';\n  document.body.classList.toggle('has-dock', !side);\n  const cats = $('.cats');\n  if (cats) cats.dataset.cols = (side ? w - 368 : w) >= 700 ? '2' : '1';\n  const nets = $('.nets');\n  if (nets) nets.dataset.row = w \u003c 480 ? '1' : '0';\n}\nif (window.ResizeObserver) new ResizeObserver(layout).observe(stageEl);\nelse window.addEventListener('resize', layout);\n\n/* reflete as escolhas nos cards (sem redesenhar) e atualiza o resumo */\nfunction sync() {\n  const st = status();\n  $$('.net').forEach(b => {\n    const on = b.dataset.id === ui.net;\n    b.setAttribute('aria-checked', on ? 'true' : 'false');\n    $('.net__picktxt', b).textContent = on ? 'Escolhida' : 'Escolher';\n  });\n  const nets = $('.nets');\n  if (nets) nets.classList.toggle('has-pick', !!st.net);\n  if (st.net) { const s = $('#sec-net'); if (s) s.classList.remove('is-missing'); }\n  if (st.cats.length) { const s = $('#sec-cat'); if (s) s.classList.remove('is-missing'); }\n  state.cats.forEach(c => {\n    const card = $('.cat[data-cat=\"' + q(c.id) + '\"]');\n    if (!card) return;\n    const x = st.cats.find(k => k.c === c), on = !!x, chosen = on ? selOf(c.id) : [];\n    card.classList.toggle('is-on', on);\n    card.classList.toggle('is-done', on && x.limit > 0 && x.missing === 0);\n    if (!on || !x.missing) card.classList.remove('is-missing');\n    const add = $('.cat__add', card);\n    add.setAttribute('aria-checked', on ? 'true' : 'false');\n    $('.cat__addtxt', add).textContent = on ? 'Adicionada ao meu combo' : 'Adicionar ao meu combo';\n    $$('.app', card).forEach(b => b.setAttribute('aria-checked', chosen.indexOf(b.dataset.app) >= 0 ? 'true' : 'false'));\n    const cnt = $('.count', card);\n    if (cnt) cnt.textContent = on ? chosen.length + ' de ' + x.limit + ' ' + plural(chosen.length, 'escolhido', 'escolhidos') : '';\n  });\n  renderSummary(st);\n}\nfunction renderSummary(st) {\n  st = st || status();\n  const n = need(st);\n  const h = ui.error ? { cls: ' is-error', txt: ui.error } : n ? { cls: '', txt: n.msg } : { cls: ' is-ok', txt: 'Combo completo' };\n  const bump = ui.lastTotal !== null && ui.lastTotal !== st.total;\n  ui.lastTotal = st.total;\n  const side = $('#sum-side');\n  if (side) {\n    const keep = $('.sumb', side) ? $('.sumb', side).scrollTop : 0;\n    side.innerHTML =\n      '\u003cdiv class=\"sumh\">\u003cdiv class=\"sumh__row\">\u003ch2>Seu combo\u003c/h2>' + (st.net || st.cats.length ? '\u003cbutton type=\"button\" class=\"sumh__clear\" data-act=\"clear\">Limpar\u003c/button>' : '') + '\u003c/div>' + sumHero(st) + '\u003c/div>' +\n      '\u003cdiv class=\"sumb\">' + sumBody(st, true) + '\u003c/div>' +\n      '\u003cdiv class=\"sumf\">' + totalHTML(st, bump) + '\u003cbutton type=\"button\" class=\"cta\" data-act=\"want\">Quero esse combo\u003c/button>\u003cp class=\"hint' + h.cls + '\" aria-live=\"polite\">' + esc(h.txt) + '\u003c/p>\u003c/div>';\n    $('.sumb', side).scrollTop = keep;\n  }\n  const parts = [];\n  if (st.net) parts.push(speedText(st.net));\n  if (st.cats.length) parts.push(st.cats.length + ' ' + plural(st.cats.length, 'categoria', 'categorias'));\n  if (st.apps) parts.push(st.apps + ' ' + plural(st.apps, 'app', 'apps'));\n  dockEl.innerHTML = '\u003cdiv class=\"dock__in\">\u003cdiv class=\"dock__info\">\u003cp class=\"dock__line' + (ui.error ? ' is-error' : '') + '\" aria-live=\"polite\">' + esc(ui.error || parts.join(', ') || 'Comece escolhendo a internet') + '\u003c/p>' +\n    '\u003cp class=\"dock__total\">R$ ' + money(st.total) + '\u003csmall>/mês\u003c/small>\u003c/p>\u003c/div>' +\n    '\u003cbutton type=\"button\" class=\"dock__view\" data-act=\"view\">Ver resumo\u003c/button>\u003cbutton type=\"button\" class=\"cta\" data-act=\"want\">Quero esse combo\u003c/button>\u003c/div>';\n}\n\n/* ---------- escolhas ---------- */\nfunction replay(el, cls) { if (el) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); } }\nfunction chooseNet(id) {\n  if (!netById(id)) return;\n  ui.net = id; ui.error = '';\n  sync();\n}\nfunction toggleCat(id) {\n  const c = catById(id);\n  if (!c) return;\n  if (ui.cats[id]) { delete ui.cats[id]; delete ui.sel[id]; }   // remover a categoria tira também os aplicativos e o valor\n  else addCat(c);\n  ui.error = '';\n  sync();\n}\nfunction pickApp(catId, appId) {\n  const c = catById(catId), a = appById(appId);\n  if (!c || !a) return;\n  if (!ui.cats[catId]) {\n    replay($('.cat[data-cat=\"' + q(catId) + '\"] .cat__add'), 'is-nudge');\n    toast('Adicione ' + c.name + ' ao combo para escolher o aplicativo.');\n    return;\n  }\n  const list = selOf(catId), i = list.indexOf(appId), limit = catLimit(c);\n  if (i >= 0) list.splice(i, 1);\n  else if (limit \u003c= 1) { list.length = 0; list.push(appId); }\n  else if (list.length >= limit) {\n    replay($('.cat[data-cat=\"' + q(catId) + '\"] .count'), 'is-full');\n    toast(c.name + ' libera ' + limit + ' aplicativos. Toque em um já escolhido para trocar.');\n    return;\n  } else list.push(appId);\n  // o mesmo aplicativo não entra duas vezes no combo\n  if (list.indexOf(appId) >= 0) addedCats().forEach(o => {\n    if (o.id === catId) return;\n    const other = selOf(o.id), k = other.indexOf(appId);\n    if (k >= 0) { other.splice(k, 1); toast(a.name + ' saiu de ' + o.name + ' e ficou em ' + c.name + '.'); }\n  });\n  ui.error = '';\n  sync();\n}\nfunction want() {\n  const st = status(), n = need(st);\n  if (n) {\n    ui.error = n.msg + '.';\n    renderSummary(st);\n    toast(ui.error);\n    const el = $(n.sel);\n    replay(el, 'is-missing');\n    if (el) el.scrollIntoView({ behavior: 'smooth', block: n.sel.charAt(0) === '#' ? 'start' : 'center' });\n    return;\n  }\n  openSummary(st);\n}\nfunction openSummary(st) {\n  st = st || status();\n  const wa = waNumber(), n = need(st);\n  sumEl.innerHTML =\n    '\u003cdiv class=\"sumh\">\u003cdiv class=\"sumh__row\">\u003ch2>Resumo do seu combo\u003c/h2>\u003c/div>' + sumHero(st) +\n      '\u003cbutton type=\"button\" class=\"sum__close\" data-act=\"sum-close\" aria-label=\"Fechar resumo\">' + ICON.close + '\u003c/button>\u003c/div>' +\n    '\u003cdiv class=\"sumb\">' + sumBody(st, false) + '\u003c/div>' +\n    '\u003cdiv class=\"sumf\">' + totalHTML(st, false) +\n      (n ? '\u003cp class=\"sum__note is-todo\">' + esc(n.msg) + '.\u003c/p>\u003cdiv class=\"sum__btns\">\u003cbutton type=\"button\" class=\"cta\" data-act=\"sum-close\">Continuar montando\u003c/button>\u003c/div>'\n         : '\u003cp class=\"sum__note\">' + (wa ? 'O WhatsApp abre com a mensagem pronta. Você confere e envia.' : 'Copie o resumo e envie ao consultor.' + (ui.editing ? ' Para abrir o WhatsApp direto, cadastre o número comercial na aba Provedor.' : '')) + '\u003c/p>' +\n           '\u003cdiv class=\"sum__btns\">\u003cbutton type=\"button\" class=\"btn-ghost\" data-act=\"sum-close\">Alterar escolhas\u003c/button>' +\n           (wa ? '\u003cbutton type=\"button\" class=\"cta\" data-act=\"send-wa\">' + ICON.chat + 'Enviar pelo WhatsApp\u003c/button>' : '\u003cbutton type=\"button\" class=\"cta\" data-act=\"copy-sum\">' + ICON.copy + 'Copiar resumo\u003c/button>') + '\u003c/div>') +\n    '\u003c/div>';\n  if (sumEl.showModal) sumEl.showModal(); else sumEl.setAttribute('open', '');\n}\nfunction closeSummary() { if (sumEl.open) { if (sumEl.close) sumEl.close(); else sumEl.removeAttribute('open'); } }\nsumEl.addEventListener('click', e => { if (e.target === sumEl) closeSummary(); });\n\nlet toastTimer = 0;\nfunction toast(msg) {\n  toastEl.textContent = msg;\n  toastEl.classList.add('is-on');\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(() => toastEl.classList.remove('is-on'), 3400);\n}\nfunction copyText(text) {\n  const fallback = () => { const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0'; (sumEl.open ? sumEl : document.body).appendChild(t); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} t.remove(); return ok; };\n  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(() => true, fallback);\n  return Promise.resolve(fallback());\n}\n\n/* =====================================================================\n   MODO DE EDIÇÃO\n   ===================================================================== */\nconst TABS = [['provider', 'Provedor'], ['nets', 'Internet'], ['cats', 'Categorias'], ['apps', 'Aplicativos'], ['export', 'Exportar']];\nconst hasDemo = () => !!state.provider.demo || state.nets.some(n => n.demo) || state.cats.some(c => c.demo);\n\nfunction setEditing(on) {\n  ui.editing = on;\n  document.body.classList.toggle('is-editing', on);\n  document.body.classList.toggle('panel-closed', !ui.panelOpen);\n  if (on) { renderBar(); renderEditor(); }\n  renderStage();\n}\nfunction renderBar() {\n  barEl.innerHTML = '\u003cspan class=\"bar__title\">Modo de edição\u003c/span>' +\n    (hasDemo() ? '\u003cspan class=\"bar__tag\">Dados de exemplo\u003c/span>' : '') +\n    '\u003cspan class=\"bar__warn\">\u003c/span>\u003cspan class=\"bar__sp\">\u003c/span>' +\n    '\u003cbutton type=\"button\" class=\"ebtn ebtn--dark bar__toggle\" data-act=\"panel\">' + (ui.panelOpen ? ICON.eye + 'Ver combo' : ICON.pencil + 'Editar') + '\u003c/button>' +\n    '\u003cbutton type=\"button\" class=\"ebtn ebtn--dark\" data-act=\"edit-off\" title=\"Oculta os controles de edição\">' + ICON.eye + 'Apresentar\u003c/button>' +\n    '\u003cbutton type=\"button\" class=\"ebtn ebtn--pri\" data-act=\"export\">' + ICON.download + 'Exportar\u003cspan class=\"long\">&nbsp;HTML personalizado\u003c/span>\u003c/button>';\n}\nconst fld = (label, path, value, o) => {\n  o = o || {};\n  return '\u003clabel class=\"f\">\u003cspan>' + label + '\u003c/span>\u003cinput type=\"' + (o.type || 'text') + '\" data-path=\"' + path + '\" value=\"' + esc(value) + '\"' +\n    (o.kind ? ' data-kind=\"' + o.kind + '\"' : '') + (o.list ? ' list=\"' + o.list + '\"' : '') + (o.ph ? ' placeholder=\"' + esc(o.ph) + '\"' : '') + (o.attrs || '') + '>' +\n    (o.help ? '\u003csmall>' + o.help + '\u003c/small>' : '') + '\u003c/label>';\n};\nconst appSelect = (act, data, exclude, label) => {\n  const free = state.apps.filter(a => exclude.indexOf(a.id) \u003c 0);\n  return '\u003cselect class=\"sel\" data-change=\"' + act + '\"' + data + (free.length ? '' : ' disabled') + '>\u003coption value=\"\">' + (free.length ? label : 'Todos os aplicativos já estão aqui') + '\u003c/option>' +\n    free.map(a => '\u003coption value=\"' + esc(a.id) + '\">' + esc(a.name) + '\u003c/option>').join('') + '\u003c/select>';\n};\nconst demoTag = on => on ? '\u003cspan class=\"tag-demo\" title=\"Dados de exemplo, ainda não editados\">Exemplo\u003c/span>' : '';\nconst moveBtns = (kind, i, last) =>\n  '\u003cbutton type=\"button\" class=\"ebtn ebtn--sm ebtn--ico\" data-act=\"' + kind + '-up\" data-i=\"' + i + '\"' + (i ? '' : ' disabled') + ' aria-label=\"Mover para antes\" title=\"Mover para antes\">' + ICON.up + '\u003c/button>' +\n  '\u003cbutton type=\"button\" class=\"ebtn ebtn--sm ebtn--ico\" data-act=\"' + kind + '-down\" data-i=\"' + i + '\"' + (i \u003c last ? '' : ' disabled') + ' aria-label=\"Mover para depois\" title=\"Mover para depois\">' + ICON.down + '\u003c/button>';\nconst waHelp = () => { const p = state.provider, wa = waNumber(); return !String(p.whatsapp).trim() ? 'Sem número, o botão final oferece “Copiar resumo”.' : wa ? 'O pedido abre em wa.me/' + wa + ' com a mensagem preenchida.' : 'Número incompleto. Informe DDD + número (o 55 é colocado automaticamente).'; };\n\nfunction providerTab() {\n  const p = state.provider, c = p.colors;\n  return '\u003ch3>Identidade\u003c/h3>\u003cdiv class=\"box\">' +\n      fld('Nome do provedor', 'provider.name', p.name) +\n      '\u003cdiv class=\"f\">\u003cspan>Logo\u003c/span>\u003cdiv class=\"logo-prev\">\u003cdiv class=\"logo-prev__img\">' + (p.logo ? '\u003cimg src=\"' + esc(p.logo) + '\" alt=\"\">' : 'sem logo') + '\u003c/div>\u003cdiv class=\"logo-prev__btns\">' +\n        '\u003clabel class=\"ebtn ebtn--sm\">Carregar logo\u003cinput class=\"hid\" type=\"file\" accept=\"image/*\" data-upload=\"provider\">\u003c/label>' +\n        (p.logo ? '\u003cbutton type=\"button\" class=\"ebtn ebtn--sm ebtn--danger\" data-act=\"logo-del\">Remover\u003c/button>' : '') + '\u003c/div>\u003c/div>' +\n        '\u003csmall>PNG com fundo transparente ou SVG ficam melhores. A imagem fica guardada dentro do arquivo.\u003c/small>\u003c/div>' +\n      (p.logo ? '\u003clabel class=\"chk\">\u003cinput type=\"checkbox\" data-path=\"provider.showName\"' + (p.showName ? ' checked' : '') + '>Mostrar o nome ao lado do logo\u003c/label>' : '') +\n    '\u003c/div>' +\n    '\u003ch3>Cores\u003c/h3>\u003cdiv class=\"box\">\u003cdiv class=\"presets\">' + PRESETS.map((x, i) => '\u003cbutton type=\"button\" data-act=\"preset\" data-i=\"' + i + '\">\u003ci style=\"background:linear-gradient(135deg,' + x.brand + ',' + x.brand2 + ');--c:' + x.cta + '\">\u003c/i>' + x.name + '\u003c/button>').join('') + '\u003c/div>' +\n      '\u003cdiv class=\"row\">' + fld('Principal', 'provider.colors.brand', c.brand, { type: 'color' }) + fld('Degradê', 'provider.colors.brand2', c.brand2, { type: 'color' }) + '\u003c/div>' +\n      '\u003cdiv class=\"row\">' + fld('Botão e destaques', 'provider.colors.cta', c.cta, { type: 'color' }) + fld('Fundo da página', 'provider.colors.bg', c.bg, { type: 'color' }) + '\u003c/div>\u003c/div>' +\n    '\u003ch3>Contratação\u003c/h3>\u003cdiv class=\"box\">' +\n      fld('WhatsApp comercial', 'provider.whatsapp', p.whatsapp, { type: 'tel', ph: '(11) 99999-0000', help: '\u003cspan data-wa-help>' + waHelp() + '\u003c/span>' }) +\n    '\u003c/div>' +\n    '\u003ch3>Textos da página\u003c/h3>\u003cdiv class=\"box\">' +\n      fld('Título', 'provider.headline', p.headline) + fld('Frase de apoio', 'provider.sub', p.sub) +\n      '\u003clabel class=\"f\">\u003cspan>Rodapé (condições comerciais)\u003c/span>\u003ctextarea data-path=\"provider.footer\">' + esc(p.footer) + '\u003c/textarea>\u003c/label>\u003c/div>';\n}\n\n/* --- internet --- */\nconst netLabel = n => '\u003cspan>' + esc(n.name || speedText(n) || 'Internet sem nome') + '\u003c/span>\u003csmall>' + esc(speedText(n)) + ', R$ ' + money(n.price) + '\u003c/small>';\nfunction netEditor(n, i) {\n  const base = 'nets.' + i, open = ui.openNet === n.id;\n  const head = '\u003cdiv class=\"acc__head\">\u003cbutton type=\"button\" class=\"acc__title\" data-act=\"net-open\" data-id=\"' + esc(n.id) + '\" aria-expanded=\"' + open + '\">' + ICON.right +\n      '\u003cspan class=\"acc__label\" data-acc-label>' + netLabel(n) + '\u003c/span>' + demoTag(n.demo) + '\u003c/button>' + moveBtns('net', i, state.nets.length - 1) + '\u003c/div>';\n  if (!open) return '\u003cdiv class=\"acc\" data-ed=\"' + esc(n.id) + '\">' + head + '\u003c/div>';\n  return '\u003cdiv class=\"acc is-open\" data-ed=\"' + esc(n.id) + '\">' + head + '\u003cdiv class=\"acc__body\">' +\n    '\u003ch3>Velocidade e preço\u003c/h3>' +\n    '\u003cdiv class=\"row\">' + fld('Nome', base + '.name', n.name) + fld('Selo (opcional)', base + '.badge', n.badge, { list: 'dl-badge', ph: 'ex.: Mais vendido' }) + '\u003c nction netsTab() {\n  return '\u003cdatalist id=\"dl-badge\">' + BADGE_HINTS.map(x => '\u003coption value=\"' + x + '\">').join('') + '\u003c/datalist>' +\n    '\u003cdatalist id=\"dl-unit\">\u003coption value=\"Mega\">\u003coption value=\"Giga\">\u003c/datalist>' +\n    '\u003cp class=\"help\" style=\"margin:0 0 10px\">A internet é a base do combo: o cliente escolhe uma e ela entra uma única vez no total.\u003c/p>' +\n    state.nets.map(netEditor).join('') +\n    '\u003cbutton type=\"button\" class=\"ebtn\" data-act=\"net-add\" style=\"width:100%\">' + ICON.plus + 'Nova velocidade\u003c/button>';\n}\n\n/* --- categorias --- */\nconst catLabel = c => '\u003cspan>' + esc(c.name || 'Categoria sem nome') + '\u003c/span>\u003csmall>' + (c.price > 0 ? '+ R$ ' + money(c.price) : 'sem adicional') + ', ' + askText(c).toLowerCase() + '\u003c/small>';\nfunction catMeta(c) {\n  const valid = validOptions(c).length;\n  return '\u003cp class=\"grp__prev\">No card: “' + esc(askText(c)) + '”, ' + (c.price > 0 ? '+ R$ ' + money(c.price) + ' por mês' : 'sem adicional') + '\u003c/p>' +\n    (valid && valid \u003c= c.limit ? '\u003cp class=\"grp__warn\">' + (valid \u003c c.limit ? 'Há só ' + valid + ' ' + plural(valid, 'aplicativo', 'aplicativos') + ' para ' + c.limit + ' escolhas. ' : 'Com ' + valid + ' ' + plural(valid, 'opção', 'opções') + ' e ' + c.limit + ' ' + plural(c.limit, 'escolha', 'escolhas') + ', o cliente não tem alternativa: ' + plural(valid, 'o aplicativo entra sozinho', 'os aplicativos entram sozinhos') + ' ao adicionar a categoria. ') + 'Adicione aplicativos ou reduza a quantidade.\u003c/p>' : '');\n}\nfunction catEditor(c, i) {\n  const base = 'cats.' + i, open = ui.openCat === c.id, opts = c.options;\n  const head = '\u003cdiv class=\"acc__head\">\u003cbutton type=\"button\" class=\"acc__title\" data-act=\"cat-open\" data-id=\"' + esc(c.id) + '\" aria-expanded=\"' + open + '\">' + ICON.right +\n      '\u003cspan class=\"acc__label\" data-acc-label>' + catLabel(c) + '\u003c/span>' + demoTag(c.demo) + '\u003c/button>' + moveBtns('cat', i, state.cats.length - 1) + '\u003c/div>';\n  if (!open) return '\u003cdiv class=\"acc\" data-ed=\"' + esc(c.id) + '\">' + head + '\u003c/div>';\n  return '\u003cdiv class=\"acc is-open\" data-ed=\"' + esc(c.id) + '\">' + head + '\u003cdiv class=\"acc__body\">' +\n    '\u003ch3>Categoria e preço\u003c/h3>' +\n    '\u003cdiv class=\"row\">' + fld('Nome', base + '.name', c.name, { list: 'dl-cat' }) + fld('Adicional/mês (R$)', base + '.price', money(c.price), { kind: 'money' }) + '\u003c/div>' +\n    '\u003cp class=\"help\" style=\"margin:-4px 0 10px\">Use 0,00 para uma categoria incluída, sem adicional. O valor é cobrado uma vez por categoria, não por aplicativo.\u003c/p>' +\n    '\u003cdiv class=\"row\">' + fld('Escolhas liberadas', base + '.limit', c.limit, { type: 'number', kind: 'int', attrs: ' min=\"1\" max=\"20\"' }) +\n      '\u003clabel class=\"chk\" style=\"margin-bottom:18px\">\u003cinput type=\"checkbox\" data-path=\"' + base + '.startAdded\"' + (c.startAdded ? ' checked' : '') + '>Já começa no combo\u003c/label>\u003c/div>' +\n    '\u003cdiv data-cat-meta>' + catMeta(c) + '\u003c/div>' +\n    '\u003ch3>Aplicativos desta categoria\u003c/h3>' +\n    opts.map((o, oi) => {\n      const a = appById(o.appId);\n      if (!a) return '';\n      const d = ' data-i=\"' + i + '\" data-o=\"' + oi + '\"';\n      return '\u003cdiv class=\"optrow\">\u003cdiv class=\"optrow__top\">' + tileHTML(a) + '\u003cb>' + esc(a.name) + '\u003c/b>' +\n          '\u003cbutton type=\"button\" class=\"ebtn ebtn--sm ebtn--ico\" data-act=\"opt-up\"' + d + (oi ? '' : ' disabled') + ' aria-label=\"Subir\">' + ICON.up + '\u003c/button>' +\n          '\u003cbutton type=\"button\" class=\"ebtn ebtn--sm ebtn--ico\" data-act=\"opt-down\"' + d + (oi \u003c opts.length - 1 ? '' : ' disabled') + ' aria-label=\"Descer\">' + ICON.down + '\u003c/button>' +\n          '\u003cbutton type=\"button\" class=\"ebtn ebtn--sm ebtn--ico ebtn--danger\" data-act=\"opt-del\"' + d + ' aria-label=\"Tirar da categoria\">' + ICON.close + '\u003c/button>\u003c/div>' +\n        '\u003cdiv class=\"optrow__more\">\u003clabel class=\"chk\">\u003cinput type=\"checkbox\" data-path=\"' + base + '.options.' + oi + '.ads\"' + (o.ads ? ' checked' : '') + '>Com anúncios\u003c/label>' +\n          '\u003cinput type=\"text\" data-path=\"' + base + '.options.' + oi + '.variant\" value=\"' + esc(o.variant) + '\" placeholder=\"Versão (ex.: 3 licenças)\" aria-label=\"Versão\">\u003c/div>\u003c/div>';\n    }).join('') +\n    appSelect('opt-add', ' data-i=\"' + i + '\"', opts.map(o => o.appId), '+ Adicionar aplicativo à categoria') +\n    '\u003cdiv class=\"row\" style=\"margin-top:14px\">\u003cbutton type=\"button\" class=\"ebtn ebtn--sm\" data-act=\"cat-dup\" data-i=\"' + i + '\">' + ICON.copy + 'Duplicar\u003c/button>' +\n    '\u003cbutton type=\"button\" class=\"ebtn ebtn--sm ebtn--danger\" data-act=\"cat-del\" data-i=\"' + i + '\">' + ICON.trash + 'Remover\u003c/button>\u003c/div>' +\n  '\u003c/div>\u003c/div>';\n}\nfunction catsTab() {\n  return '\u003cdatalist id=\"dl-cat\">' + CATEGORY_HINTS.map(x => '\u003coption value=\"' + x + '\">').join('') + '\u003c/datalist>' +\n    '\u003cp class=\"help\" style=\"margin:0 0 10px\">O cliente pode adicionar uma, várias ou todas as categorias. Cada uma tem seu adicional e seu limite de aplicativos.\u003c/p>' +\n    state.cats.map(catEditor).join('') +\n    '\u003cbutton type=\"button\" class=\"ebtn\" data-act=\"cat-add\" style=\"width:100%\">' + ICON.plus + 'Nova categoria\u003c/button>' +\n    '\u003cp class=\"help\">A ordem aqui é a ordem dos cards, dois por linha no computador.\u003c/p>';\n}\n\n/* --- catálogo de aplicativos --- */\nfunction appUse(id) {\n  return state.cats.filter(c => c.options.some(o => o.appId === id)).length + state.nets.filter(n => n.included.indexOf(id) >= 0).length;\n}\nfunction appRow(a) {\n  const i = state.apps.indexOf(a), n = appUse(a.id);\n  return '\u003cdiv class=\"approw\" data-app-row=\"' + esc(a.id) + '\">' + tileHTML(a) +\n    '\u003cinput type=\"text\" data-path=\"apps.' + i + '.name\" value=\"' + esc(a.name) + '\" aria-label=\"Nome do aplicativo\" data-tile>' +\n    '\u003cbutton type=\"button\" class=\"ebtn ebtn--sm ebtn--ico ebtn--danger\" data-act=\"app-del\" data-id=\"' + esc(a.id) + '\" aria-label=\"Excluir ' + esc(a.name) + '\" title=\"Excluir do catálogo\">' + ICON.trash + '\u003c/button>' +\n    '\u003cdiv class=\"approw__more\">' +\n      '\u003cinput type=\"text\" data-path=\"apps.' + i + '.short\" value=\"' + esc(a.short) + '\" maxlength=\"6\" placeholder=\"Sigla\" aria-label=\"Sigla mostrada no ícone sem logo\" title=\"Sigla mostrada no ícone quando não há logo\" data-tile>' +\n      '\u003cinput type=\"color\" data-path=\"apps.' + i + '.bg\" value=\"' + esc(/^#[0-9a-f]{6}$/i.test(a.bg || '') ? a.bg : '#1F2937') + '\" aria-label=\"Cor de fundo do ícone\" title=\"Cor de fundo do ícone\" data-tile>' +\n      '\u003clabel class=\"ebtn ebtn--sm\">' + (a.logo ? 'Trocar logo' : 'Carregar logo') + '\u003cinput class=\"hid\" type=\"file\" accept=\"image/*\" data-upload=\"app\" data-id=\"' + esc(a.id) + '\">\u003c/label>' +\n      (a.logo ? '\u003cbutton type=\"button\" class=\"ebtn ebtn--sm ebtn--danger\" data-act=\"app-logo-del\" data-id=\"' + esc(a.id) + '\">Tirar logo\u003c/button>' : '') +\n      '\u003csmall>' + (n ? 'em uso' : 'fora do combo') + '\u003c/small>\u003c/div>\u003c/div>';\n}\nconst appListHTML = () => {\n  const s = ui.appFilter.trim().toLowerCase();\n  return state.apps.filter(a => !s || a.name.toLowerCase().indexOf(s) >= 0).map(appRow).join('') || '\u003cp class=\"help\">Nada encontrado.\u003c/p>';\n};\nfunction appsTab() {\n  return '\u003cp class=\"help\" style=\"margin:0 0 10px\">Catálogo de aplicativos e benefícios. Cadastre aqui e depois escolha em quais categorias (ou em qual internet, como incluído) cada um aparece. O ícone é um bloco 4:3: imagens nessa proporção preenchem rEditor(); },\n  'net-add': () => {\n    const n = { id: uid('n-'), demo: false, name: 'Nova internet', speed: '500', unit: 'Mega', price: 99.9, badge: '', wifi: 'Wi-Fi 6', tech: '100% fibra', install: 'Instalação grátis', perks: '', fine: '', included: [] };\n    state.nets.push(n); ui.openNet = n.id; commit();\n    const el = $('[data-ed=\"' + n.id + '\"]'); if (el) el.scrollIntoView({ block: 'start' });\n  },\n  'net-dup': d => { const n = clone(state.nets[+d.i]); n.id = uid('n-'); n.demo = false; n.name = (n.name || 'Internet') + ' (cópia)'; state.nets.splice(+d.i + 1, 0, n); ui.openNet = n.id; commit(); },\n  'net-del': d => { const n = state.nets[+d.i]; if (!confirm('Remover a internet “' + (n.name || speedText(n)) + '”?')) return; state.nets.splice(+d.i, 1); commit(); },\n  'net-up': d => { move(state.nets, +d.i, -1); commit(); },\n  'net-down': d => { move(state.nets, +d.i, 1); commit(); },\n  'ninc-del': d => { state.nets[+d.i].included.splice(+d.k, 1); touch('nets.' + d.i); commit(); },\n\n  'cat-open': d => { ui.openCat = ui.openCat === d.id ? null : d.id; renderEditor(); },\n  'cat-add': () => {\n    const c = { id: uid('c-'), demo: false, name: 'Nova categoria', price: 0, limit: 1, startAdded: false, options: [] };\n    state.cats.push(c); ui.openCat = c.id; commit();\n    const el = $('[data-ed=\"' + c.id + '\"]'); if (el) el.scrollIntoView({ block: 'start' });\n  },\n  'cat-dup': d => { const c = clone(state.cats[+d.i]); c.id = uid('c-'); c.demo = false; c.name = (c.name || 'Categoria') + ' (cópia)'; state.cats.splice(+d.i + 1, 0, c); ui.openCat = c.id; commit(); },\n  'cat-del': d => { const c = state.cats[+d.i]; if (!confirm('Remover a categoria “' + c.name + '”?')) return; state.cats.splice(+d.i, 1); commit(); },\n  'cat-up': d => { move(state.cats, +d.i, -1); commit(); },\n  'cat-down': d => { move(state.cats, +d.i, 1); commit(); },\n  'opt-up': d => { move(state.cats[+d.i].options, +d.o, -1); touch('cats.' + d.i); commit(); },\n  'opt-down': d =>   Object.keys(d.books).forEach(id => { if (!BOOKS[id]) delete d.books[id]; });                  // planilha retirada do arquivo: os valores digitados nela saem junto
  d.provider = Object.assign({ name: '', logo: '', showName: false, headline: '', sub: '', whatsapp: '', footer: '' }, d.provider);
  d.provider.colors = Object.assign({}, PRESETS ? PRESETS[0] : {}, d.provider.colors);
  delete d.provider.colors.name;
  d.apps = Array.isArray(d.apps) ? d.apps : [];

/* rascunho salvo por uma versão anterior deste arquivo: troca os planos de exemplo que ninguém editou e aplica,
   uma única vez, as correções de cada versão também nos planos já editados */
function migrate(d) {
  const from = d.meta.version || 1;
  if (from < EMBEDDED.meta.version) {
    d.plans = d.plans.map(p => { const fresh = p.demo ? EMBEDDED.plans.find(x => x.id === p.id) : null; return fresh ? clone(fresh) : p; });
    // versão 3: o Globoplay da categoria Top é o plano com anúncios (como Disney+ e HBO Max); o da Premium segue sem anúncios
    if (from < 3) {
      const isTop = s => String(s || '').trim().toLowerCase() === 'top';
      d.plans.forEach(p => p.groups.forEach(g => { if (isTop(g.label)) g.options.forEach(o => { if (o && o.appId === 'globoplay') o.ads = true; }); }));
      d.finance.areas.forEach(a => { if (isTop(a.name)) a.apps = a.apps.map(x => (x === 'globoplay' ? 'globoplay|com anúncios' : x)); });
    }
    d.meta.version = EMBEDDED.meta.version;
  }
  return d;
}

const selOf = (planId, groupId) => {

function planStatus(plan) {
  const groups = liveGroups(plan).map(g => {
    const chosen = selOf(plan.id, g.id);
    return { g, chosen, limit: groupLimit(g), missing: Math.max(0, groupLimit(g) - chosen.length) };
  });
  const need = groups.reduce((n, x) => n + x.limit, 0);
  const missing = groups.reduce((n, x) => n + x.missing, 0);
  return { groups, need, missing, picked: need - missing, complete: missing === 0 };
}
function chosenOptions(plan) {
  const out = [];
  liveGroups(plan).forEach(g => selOf(plan.id, g.id).forEach(id => {
    const o = g.options.find(x => x.appId === id), a = appById(id);
    if (o && a) out.push({ group: g, opt: o, app: a });

}

function rgb(hex) {
  let h = String(hex || '').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return h.length !== 6 || isNaN(n) ? [0, 0, 0] : [n >> 16 & 255, n >> 8 & 255, n & 255];
}
const lum = c => { const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(c[0]) + .7152 * f(c[1]) + .0722 * f(c[2]); };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };

const mixc = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
