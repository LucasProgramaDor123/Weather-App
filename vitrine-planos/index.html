function syncPlan(planId) {
  const plan = planById(planId), card = $('.plan[data-plan="' + CSS.escape(planId) + '"]');
  if (!plan || !card) return;
  const st = planStatus(plan);
  st.groups.forEach(x => {
    const box = $('.chooser[data-group="' + CSS.escape(x.g.id) + '"]', card);
    if (!box) return;
    $$('.opt', box).forEach(b => b.setAttribute('aria-pressed', x.chosen.indexOf(b.dataset.app) >= 0 ? 'true' : 'false'));
    $('.count', box).innerHTML = x.chosen.length + ' de ' + x.limit + '<i> ' + plural(x.chosen.length, 'selecionado', 'selecionados') + '</i>';
    box.classList.toggle('is-complete', x.missing === 0);
    if (x.missing === 0) box.classList.remove('is-missing');
  });
  const hint = $('.plan__hint', card);
  hint.classList.remove('is-error');
  hint.classList.toggle('is-ok', st.need > 0 && st.complete);
  hint.textContent = !st.need ? '' : st.complete ? 'Escolha completa' :
    st.picked === 0 ? 'Escolha ' + st.need + ' ' + plural(st.need, 'aplicativo', 'aplicativos') + ' para continuar' :

/* ---------- escolha dos aplicativos ---------- */
function pick(planId, groupId, appId) {
  const plan = planById(planId), g = plan && plan.groups.find(x => x.id === groupId);
  if (!g) return;
  const arr = selOf(planId, groupId), i = arr.indexOf(appId), limit = groupLimit(g);
  if (i >= 0) arr.splice(i, 1);
  else if (limit <= 1) { arr.length = 0; arr.push(appId); }
  else if (arr.length >= limit) {
    const box = $('.plan[data-plan="' + CSS.escape(planId) + '"] .chooser[data-group="' + CSS.escape(groupId) + '"]');
    if (box) { box.classList.remove('is-full'); void box.offsetWidth; box.classList.add('is-full'); }
    toast('Este grupo libera ' + limit + ' aplicativos. Toque em um já escolhido para trocar.');
    return;
  } else arr.push(appId);
  // o mesmo aplicativo não é contado duas vezes no mesmo plano
  if (arr.indexOf(appId) >= 0) plan.groups.forEach(o => { if (o.id !== groupId) { const a = selOf(planId, o.id), k = a.indexOf(appId); if (k >= 0) a.splice(k, 1); } });
  ui.activePlan = planId;
  syncPlan(planId);
  renderDock();
}
function requestPlan(planId) {
  const plan = planById(planId);
  if (!plan) return;
  const st = planStatus(plan);
  ui.activePlan = planId;
  if (!st.complete) {
    const card = $('.plan[data-plan="' + CSS.escape(planId) + '"]');
    let first = null;
    st.groups.filter(x => x.missing).forEach(x => {
      const box = $('.chooser[data-group="' + CSS.escape(x.g.id) + '"]', card);
      box.classList.remove('is-missing'); void box.offsetWidth; box.classList.add('is-missing');
      first = first || box;
    });
    const hint = $('.plan__hint', card);
    hint.classList.add('is-error');
    hint.textContent = (st.picked ? 'Falta escolher ' : 'Escolha ') + st.missing + ' ' + plural(st.missing, 'aplicativo', 'aplicativos') + ' antes de continuar';
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
    renderDock();
    return;
  }
  openSummary(plan);
}
function summaryText(plan) {
  const chosen = chosenOptions(plan), incl = plan.included.map(appById).filter(Boolean), extras = planExtras(plan);
  const lines = ['Olá! Quero contratar este plano' + (state.provider.name ? ' da ' + state.provider.name : '') + ':', ''];
  lines.push('*Plano:* ' + [plan.name, speedText(plan)].filter(Boolean).join(' - '));
  if (chosen.length) {
    lines.push('*' + plural(chosen.length, 'Aplicativo escolhido', 'Aplicativos escolhidos') + ':*');
    chosen.forEach(c => lines.push('- ' + c.app.name + (optionTags(c.opt).length ? ' (' + optionTags(c.opt).join(', ') + ')' : '') + (c.group.label ? ' [' + c.group.label + ']' : '')));
  }
  if (incl.length) lines.push('*Já incluídos:* ' + incl.map(a => a.name).join(', '));
  lines.push('*Valor mensal:* R$ ' + money(planTotal(plan)) + (extras.length ? ' (plano R$ ' + money(plan.price) + extras.map(c => ' + ' + c.app.name + ' R$ ' + money(c.opt.extra)).join('') + ')' : ''));
  return lines.join('\n');
}
function openSummary(plan) {

let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('is-on'), 3200);
}
function copyText(text) {
  const fallback = () => { const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0'; (sumEl.open ? sumEl : document.body).appendChild(t); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} t.remove(); return ok; };
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(() => true, fallback);
  return Promise.resolve(fallback());
}

function readImage(file, maxDim) {
  return new Promise((resolve, reject) => {
    if (!/^image\//.test(file.type)) return reject(new Error('Escolha um arquivo de imagem (PNG, JPG, SVG ou WebP).'));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('Não foi possível ler o arquivo.'));
    fr.onload = () => {
      const url = String(fr.result);
      if (file.type === 'image/svg+xml') return file.size > 400000 ? reject(new Error('SVG muito grande (máximo 400 KB).')) : resolve(url);
      const img = new Image();
      img.onerror = () => reject(new Error('Imagem inválida.'));
      img.onload = () => {
        const s = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
        if (s === 1 && file.size < 120000) return resolve(url);
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.naturalWidth * s));
        c.height = Math.max(1, Math.round(img.naturalHeight * s));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(file.type === 'image/jpeg' ? c.toDataURL('image/jpeg', .9) : c.toDataURL('image/png'));
      };
      img.src = url;
    };
    fr.readAsDataURL(file);
  });
}

/* =====================================================================
   MOTOR DE PLANILHA
   Calcula as fórmulas dos modelos convertidos do Excel (abas "Simulador" e
   "Estudo"). Não usa a página: roda igual no navegador e nos testes.

   createBook(modelo, edicoes, local) devolve um objeto com:
     value(aba, 'A1')      valor calculado (número, texto, booleano, null ou erro)
     text(aba, 'A1')       { t: texto formatado, c: cor do formato ou '' }
     setEdit / clearEdits  valores digitados nas células de entrada
   "edicoes" é um objeto simples { 'Aba!A1': valor } guardado no rascunho.
   ===================================================================== */
function createBook(model, edits, loc) {
  'use strict';
  loc = loc || { dec: ',', grp: '.', T: 'VERDADEIRO', F: 'FALSO' };
  edits = edits || {};
  const sheets = {};
  model.sheets.forEach(sh => { sheets[sh.name] = sh; });
  const MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const DAYS = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];

  /* ---------- endereços ---------- */
  const colNum = s => { let n = 0; for (let i = 0; i < s.length; i++) n = n * 26 + s.charCodeAt(i) - 64; return n; };
  const colName = n => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; } return s; };
  const A1 = (r, c) => colName(c) + r;
  const parseA1 = a => { const m = /^\$?([A-Z]{1,3})\$?(\d+)$/.exec(a); return m ? { r: +m[2], c: colNum(m[1]) } : null; };

  /* ---------- erros ---------- */
  function Err(e) { this.e = e; }
  const isErr = v => v instanceof Err;
  const E = { div: new Err('#DIV/0!'), val: new Err('#VALUE!'), na: new Err('#N/A'), ref: new Err('#REF!'), name: new Err('#NAME?'), num: new Err('#NUM!') };

  /* ---------- análise das fórmulas ---------- */
  const astCache = {};
  function parse(src) {
    if (astCache[src]) return astCache[src];
    let p = 0;
    const s = src, n = s.length;
    const ws = () => { while (p < n && (s[p] === ' ' || s[p] === '\n' || s[p] === '\r' || s[p] === '\t')) p++; };
    const fail = why => { throw new Error('fórmula: ' + why + ' em ' + p + ': ' + src); };
    const RE_SHEET = /^(?:'((?:[^']|'')+)'|([A-Za-z_\u00C0-\u024F][\w.\u00C0-\u024F]*))!/;
    const RE_CELL = /^(\$?)([A-Z]{1,3})(\$?)(\d+)/;

    function cellAt() {             // lê A1 ou $A$1 na posição atual; null se não for referência
      const m = RE_CELL.exec(s.slice(p, p + 14));
      if (!m) return null;
      const next = s[p + m[0].length];
      if (next && /[A-Za-z0-9_(.]/.test(next)) return null;
      p += m[0].length;
      return { c: colNum(m[2]), r: +m[4], ac: !!m[1], ar: !!m[3] };
    }
    function refAt(sheet) {
      const a = cellAt();
      if (!a) return null;
      if (s[p] === ':') {
        const save = p; p++;
        const b = cellAt();
        if (b) return { t: 'rng', s: sheet, r1: a.r, c1: a.c, r2: b.r, c2: b.c, a1: a, a2: b };
        p = save;
      }
      return { t: 'ref', s: sheet, r: a.r, c: a.c, ar: a.ar, ac: a.ac };
    }
    function primary() {
      ws();
      const ch = s[p];
      if (ch === undefined) fail('fim inesperado');
      if (ch === '(') { p++; const x = expr(); ws(); if (s[p] !== ')') fail('falta )'); p++; return x; }
      if (ch === '"') {
        let out = ''; p++;
        for (;;) {
          if (p >= n) fail('texto sem fim');
          if (s[p] === '"') { if (s[p + 1] === '"') { out += '"'; p += 2; continue; } p++; break; }
          out += s[p++];
        }
        return { t: 's', v: out };
      }
      if (ch === '#') {
        const m = /^#(N\/A|REF!|DIV\/0!|VALUE!|NAME\?|NUM!|NULL!)/.exec(s.slice(p, p + 8));
        if (!m) fail('erro desconhecido');
        p += m[0].length; return { t: 'e', v: m[0] };
      }
      const num = /^(\d+\.?\d*(?:[eE][+-]?\d+)?|\.\d+(?:[eE][+-]?\d+)?)/.exec(s.slice(p, p + 40));
      if (num && !RE_CELL.test(s.slice(p, p + 14))) { p += num[0].length; return { t: 'n', v: parseFloat(num[0]) }; }
      const sh = RE_SHEET.exec(s.slice(p));
      if (sh) {
        const save = p; p += sh[0].length;
        const r = refAt(sh[1] !== undefined ? sh[1].replace(/''/g, "'") : sh[2]);
        if (r) return r;
        p = save;
      }
      const r = refAt(null);
      if (r) return r;

  if (kind === 'qmoney') return fnum(v) ? 'R$ ' + money(v) : '';
  if (kind === 'qint') return fnum(v) ? fmtInt(v) : '';
  if (kind === 'money') return 'R$ ' + money(v);
  if (kind === 'dec') return fnum(v) ? money(v) : '';
  if (kind === 'int') return fmtInt(v);
  if (kind === 'date') return fmtDate(v);
  return String(v == null ? '' : v);
}
function finRaw(kind, v) {
  if (kind === 'qmoney') return fnum(v) ? fnum(v).toFixed(2).replace('.', ',') : '';
  if (kind === 'qint') return fnum(v) ? String(Math.round(fnum(v))) : '';
  if (kind === 'money' || kind === 'dec') return fnum(v) || kind === 'money' ? fnum(v).toFixed(2).replace('.', ',') : '';
  if (kind === 'int') return String(Math.round(fnum(v)));
  if (kind === 'date') return fmtDate(v);
  return String(v == null ? '' : v);
}
function finParse(kind, s) {
  if (kind === 'money' || kind === 'dec' || kind === 'qmoney') return Math.max(0, Math.round(parseBR(s) * 100) / 100);
  if (kind === 'int' || kind === 'qint') return Math.max(0, Math.round(parseBR(s)));
  if (kind === 'date') return parseDateBR(s);
  return s;
}
/* largura mínima da célula numérica, em "ch": letras e algarismos contam 1, pontuação e espaço contam meio.
   Assim o valor nunca aparece cortado em telas estreitas; a tabela é que passa a rolar para os lados. */
const finW = v => { v = String(v == null ? '' : v); const wide = v.replace(/[^0-9A-Za-z$%]/g, '').length; return (wide + (v.length - wide) * .5 + .6).toFixed(1); };
const finFit = el => { if (el.hasAttribute('data-fit')) el.style.setProperty('--w', finW(el.value)); };
const finFitAttr = shown => ' data-fit style="--w:' + finW(shown) + '"';
const FIN_OV = { credit: 'money', fee: 'money' };
const FIN_OV_LABEL = { credit: 'Crédito contratado', fee: 'Mensalidade da parceria' };
function finOvShow(col, r) {
  return r.o[col] === undefined && col === 'fee' && !r.fee ? '' : 'R$ ' + money(r[col]);   // carência: mensalidade em branco
}
let finRowsNow = [];

/* ---------- consumo do crédito por categoria (quadro 7) ----------
   Cores: rampa de um matiz só (azul), do claro ao escuro, porque as categorias são níveis (Standard < ... < Premium).
   Passos validados para 1 a 5 níveis (contraste com o fundo e diferença entre vizinhos); da 6ª área em diante,
   as áreas entram juntas na barra como "Outras categorias", em cinza. */
const FIN_USE_MAX = 5, FIN_USE_REST = '#898781';
const FIN_USE_RAMP = { 1: ['#3987e5'], 2: ['#86b6ef', '#1c5cab'], 3: ['#86b6ef', '#3987e5', '#0d366b'], 4: ['#86b6ef', '#3987e5', '#1c5cab', '#0d366b'], 5: ['#86b6ef', '#5598e7', '#2a78d6', '#1c5cab', '#0d366b'] };
function finUseColors(n) {
  const ramp = FIN_USE_RAMP[Math.max(1, Math.min(FIN_USE_MAX, n))], out = [];
  for (let i = 0; i < n; i++) out.push(i < FIN_USE_MAX ? ramp[i] : FIN_USE_REST);
  return out;
}
/* aplicativos de uma área que existem no catálogo: [{ app, label }] */
function finAppsOf(a) {
  return (a.apps || []).map(x => { const k = String(x).split('|'), app = appById(k[0]); return app ? { app: app, label: app.name + (k[1] ? ' (' + k[1] + ')' : '') } : null; }).filter(Boolean);
}
/* contas do quadro: consumo de cada categoria (ativações x custo), total, quanto falta para bater o crédito
   e, por categoria, quantas ativações ainda cabem no que falta (mesmo arredondamento do quadro 3) */
function finUse(credit) {
  const f = state.finance, cents = v => Math.round(v * 100) / 100;
  credit = Math.max(0, fnum(credit));
  const rows = f.areas.map(a => { const qty = Math.max(0, Math.round(fnum(a.qty))), cost = Math.max(0, fnum(a.cost)); return { name: a.name, cost: cost, qty: qty, value: cents(qty * cost), apps: finAppsOf(a).map(x => x.label).join(', ') }; });
  const total = cents(rows.reduce((t, r) => t + r.value, 0)), qty = rows.reduce((t, r) => t + r.qty, 0), left = cents(credit - total);
  // percentual sobre o crédito: nunca "0%" para um valor que existe, nem "100%" para um valor que ainda não chegou ao crédito
  const pctTxt = v => { const t = fmtPct(v / credit, 0); return v > 0 && v / credit < 0.01 ? 'menos de 1%' : v < credit && t === '100%' ? '99%' : t; };
  const share = v => (credit > 0 && v > 0 ? pctTxt(v) + ' do crédito' : '');
  // "faltam": cada linha é uma alternativa (só aquela categoria consome o que falta), por isso "137 ativações", "ou 84 ativações"...;
  // traço onde nem uma ativação inteira cabe mais
  let alt = false;
  rows.forEach(r => {
    r.share = share(r.value);
    r.needN = r.cost > 0 && credit > 0 ? (left > 0 ? Math.floor(left / r.cost + 1e-9) : 0) : null;
    if (r.needN === null) r.need = '';
    else if (r.needN > 0) { r.need = (alt ? 'ou ' : '') + fmtInt(r.needN) + ' ' + plural(r.needN, 'ativação', 'ativações'); alt = true; }
    else r.need = '—';
  });
  // sobra menor que o custo de qualquer categoria: nenhuma ativação inteira cabe mais ("praticamente batido")
  const priced = rows.filter(r => r.needN !== null), tight = left > 0 && total > 0 && priced.length > 0 && priced.every(r => r.needN === 0);
  const state7 = credit <= 0 ? 'nocredit' : qty === 0 ? 'none' : tight ? 'tight' : left > 0 ? 'part' : left === 0 ? 'full' : 'over';
  return { rows: rows, credit: credit, total: total, qty: qty, left: left, state: state7,
    pctTxt: v => (credit > 0 ? pctTxt(v) : ''),
    pct: credit > 0 ? pctTxt(total) + ' do crédito' : '',
    leftText: credit <= 0 ? '' : left > 0 ? 'R$ ' + money(left) : left === 0 ? 'R$ 0,00' : 'passou R$ ' + money(-left),
    note: { nocredit: 'Informe o crédito mensal contratado, no quadro 1, para ver o consumo.',
      none: 'Digite quantas ativações são vendidas em cada categoria para ver o consumo do crédito.',
      part: 'Faltam R$ ' + money(left) + ' para bater o crédito.',
      tight: 'Crédito praticamente batido: sobram R$ ' + money(left) + ', menos que o custo de uma ativação.',
      full: 'Crédito batido: todo o valor contratado foi consumido.',
      over: 'Passou R$ ' + money(-left) + ' do crédito contratado.' }[state7] };
}
/* barra: cada categoria ocupa a sua parte do crédito; se o consumo passa do crédito, a barra inteira vira o consumo
   e um traço marca onde o crédito termina */
function finUseDraw(use, credit) {
  const bar = $('.use__bar', finEl);
  if (!bar) return;
  const scale = Math.max(use.credit, use.total), segs = [];
  use.rows.forEach((r, i) => {
    if (i < FIN_USE_MAX) segs.push({ key: String(i), name: r.name, value: r.value, qty: r.qty });
    else { const last = segs[segs.length - 1]; if (last && last.key === 'rest') { last.value += r.value; last.qty += r.qty; } else segs.push({ key: 'rest', name: 'Outras categorias', value: r.value, qty: r.qty }); }
  });
  const shown = segs.filter(s => s.value > 0 && scale > 0);
  let at = 0;
  segs.forEach(s => {
    const el = $('.use__seg[data-seg="' + s.key + '"]', bar);
    if (!el) return;
    const on = shown.indexOf(s) >= 0, w = on ? s.value / scale * 100 : 0;
    el.hidden = !on;
    el.style.left = at.toFixed(3) + '%'; el.style.width = w.toFixed(3) + '%';
    el.classList.toggle('is-first', on && shown[0] === s); el.classList.toggle('is-last', on && shown[shown.length - 1] === s);
    el.dataset.v = 'R$ ' + money(s.value);
    el.dataset.t = s.name + ' · ' + fmtInt(s.qty) + ' ' + plural(s.qty, 'ativação', 'ativações') + (use.credit > 0 ? ' · ' + use.pctTxt(s.value) + ' do crédito' : '');
    el.setAttribute('aria-label', el.dataset.t + ': ' + el.dataset.v);
    at += w;
  });
  const limit = $('.use__limit', bar), over = use.state === 'over';
  limit.hidden = !over;
  if (over) limit.style.left = (use.credit / use.total * 100).toFixed(3) + '%';
  bar.setAttribute('aria-label', 'Consumo do crédito: R$ ' + money(use.total) + ' de R$ ' + money(use.credit) + (use.pct ? ' (' + use.pct + ')' : '') + '. ' +
    use.rows.map(r => r.name + ' R$ ' + money(r.value)).join('; ') + '.');
  const cell = bar.closest('td'), note = $('.use__note', finEl);
  if (note) note.dataset.state = use.state;
  // no PDF a barra vira uma frase (até duas linhas); nela não entra o pedido de digitar, que só serve na tela
  const alts = 'a última coluna mostra quantas ativações de cada categoria, sozinha, consomem ';
  if (cell) cell.dataset.pdf = use.state === 'nocredit' ? 'Sem crédito contratado no mês de referência.'
    : use.state === 'none' ? 'Crédito do mês de referência: R$ ' + money(use.credit) + '. Sem ativações informadas: ' + alts + 'todo o crédito.'
    : 'Consumo no mês de referência: R$ ' + money(use.total) + ' de R$ ' + money(use.credit) + ' de crédito (' + use.pct.replace(' do crédito', '') + '). ' +
      (use.state === 'part' ? use.note.replace(/\.$/, '') + ': ' + alts + 'esse valor.' : use.note);
  $$('.xl--use th.use__cat', finEl).forEach((th, i) => { const r = use.rows[i]; if (r) th.dataset.pdf = r.name + (r.apps ? ': ' + r.apps : ''); });
  $$('.xl--use td.use__val', finEl).forEach((td, i) => { const r = use.rows[i]; if (r) td.dataset.pdf = 'R$ ' + money(r.value) + (r.share ? ' (' + r.share.replace(' do crédito', '') + ')' : ''); });
}
/* dica ao passar o mouse ou focar uma parte da barra: o valor primeiro, depois de quem é */
function finUseTip(seg) {
  const bar = $('.use__bar', finEl), tip = bar && $('.use__tip', bar);
  if (!tip) return;
  if (!seg) { tip.hidden = true; return; }
  tip.firstChild.textContent = seg.dataset.v || '';
  tip.lastChild.textContent = seg.dataset.t || '';
  tip.hidden = false;
  const B = bar.getBoundingClientRect(), S = seg.getBoundingClientRect(), w = tip.offsetWidth;
  tip.style.left = Math.max(0, Math.min(B.width - w, S.left - B.left + S.width / 2 - w / 2)) + 'px';
}
finEl.addEventListener('mouseover', e => { const s = e.target.closest ? e.target.closest('.use__seg') : null; if (s) finUseTip(s); });
finEl.addEventListener('mouseout', e => { const s = e.target.closest ? e.target.closest('.use__seg') : null; if (s && !s.contains(e.relatedTarget)) finUseTip(null); });
finEl.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('use__seg')) finUseTip(e.target); });
finEl.addEventListener('focusout', e => { if (e.target.classList && e.target.classList.contains('use__seg')) finUseTip(null); });

/* recalcula e atualiza só as células calculadas (as digitadas não são redesenhadas, para não perder o foco) */
function finRefresh() {
  if (!$('#fin-rows')) return;
  const f = state.finance, act = f.active, s = f.scen[act];
  const rows = finSchedule(act);
  finRowsNow = rows;
  f.refMonth = Math.min(Math.max(1, f.refMonth), Math.max(1, rows.length));
  const ref = rows[f.refMonth - 1] || null;
  const out = {};
  ['A', 'B'].forEach(k => { out[k + '.monthly'] = 'R$ ' + money(fnum(f.scen[k].fee) + fnum(f.scen[k].credit)); });
  out['act.id'] = s.id; out['act.fee'] = 'R$ ' + money(s.fee); out['act.credit'] = 'R$ ' + money(s.credit);
  out['act.term'] = fmtInt(s.term); out['act.first'] = fmtDate(s.first);
  const credit = ref ? ref.credit : fnum(s.credit);
  f.areas.forEach((a, i) => { out['area.' + i + '.cover'] = a.cost > 0 ? fmtInt(Math.floor(credit / a.cost + 1e-9)) : ''; });
  const use = finUse(credit);
  use.rows.forEach((r, i) => {
    out['area.' + i + '.name'] = r.name;
    out['area.' + i + '.costtxt'] = 'R$ ' + money(r.cost);
    out['area.' + i + '.costline'] = 'R$ ' + money(r.cost) + ' por ativação';
    out['area.' + i + '.use'] = 'R$ ' + money(r.value);
    out['area.' + i + '.share'] = r.share;
    out['area.' + i + '.need'] = r.need;
  });
  out['use.total'] = 'R$ ' + money(use.total);
  out['use.of'] = 'de R$ ' + money(credit) + ' de crédito';
  out['use.pct'] = use.pct;
  out['use.qty'] = fmtInt(use.qty);
  out['use.left'] = use.leftText;
  out['use.note'] = use.note;
  const pay = ref ? ref.credit + ref.fee : 0;
  out['ind.ref'] = ref ? 'Mês ' + ref.m + (ref.due ? ', ' + fmtDate(ref.due) : '') : '';
  out['ind.pay'] = ref ? 'R$ ' + money(pay) : '';
  out['ind.base'] = ref ? fmtInt(ref.end) : '';
  out['ind.rev'] = ref ? 'R$ ' + money(ref.revenue) : '';
  out['ind.share'] = ref && ref.revenue > 0 ? fmtPct(pay / ref.revenue, 2) : '';
  out['ind.persub'] = ref && ref.end > 0 ? 'R$ ' + money(pay / ref.end) : '';
  out.title = [finName(), 'Cenário ' + act + (s.id ? ' (' + s.id + ')' : '')].filter(Boolean).join(', ');
  $$('[data-o]', finEl).forEach(el => { const v = out[el.dataset.o]; el.textContent = v == null ? '' : v; });
  finUseDraw(use, credit);

  // linhas do cronograma: recria só se a quantidade de meses mudou
  const body = $('#fin-rows');
  if (body.children.length !== rows.length) body.innerHTML = rows.map(finRowHTML).join('');
  rows.forEach((r, i) => {
    const tr = body.children[i];
    tr.classList.toggle('is-ref', r.m === f.refMonth);
    const put = (k, v) => { $('[data-s="' + k + '"]', tr).textContent = v; };
    put('due', fmtDate(r.due)); put('start', fmtInt(r.start));
    $$('input[data-ov]', tr).forEach(inp => {
      inp.parentNode.classList.toggle('is-over', r.o[inp.dataset.ov] !== undefined);
      if (inp !== document.activeElement) { inp.value = finOvShow(inp.dataset.ov, r); finFit(inp); }
    });
  });
  const clear = $('[data-act="fin-clear-over"]', finEl);
  if (clear) clear.hidden = !Object.keys(f.over[act] || {}).length;

  // opções do mês de referência acompanham o prazo e o 1º vencimento
  const sel = $('#fin-ref');
  if (sel) {
    const sig = rows.map(r => r.due).join('|');
    if (sel.dataset.sig !== sig) {
      sel.dataset.sig = sig;
      sel.innerHTML = rows.length ? rows.map(r => '<option value="' + r.m + '">Mês ' + r.m + (r.due ? ' (' + fmtDate(r.due) + ')' : '') + '</option>').join('') : '<option value="1">Sem meses</option>';
    }
    sel.value = String(f.refMonth);
  }
  if (document.body.classList.contains('view-fin')) document.title = 'Análise financeira' + (finName() ? ' | ' + finName() : '');
}

/* Enter e setas para cima/baixo andam pela coluna, como numa planilha */
finEl.addEventListener('keydown', e => {

  if (!el.matches('input[data-col]')) return;

  if (e.key !== 'Enter' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;

  const next = all[all.indexOf(el) + (e.key === 'ArrowUp' || (e.key === 'Enter' && e.shiftKey) ? -1 : 1)];

});

/* =====================================================================
   CENÁRIO LIVRO (aba #analise-livro)
   Mesma lógica da aba "Premissas e cronograma", com um cenário só e, no
   lugar do crédito, a quantidade de livros por mês. A aba pergunta a
   quantidade de livros, o valor unitário e em quantos meses escalonar.
     livros no mês m  = quantidade × m ÷ meses de escalonamento, arredondado
                        para baixo: começa na menor quantia e sobe até a
                        quantidade total no último mês do escalonamento
     valor dos livros = livros no mês × valor unitário
     mensalidade      = mensalidade da parceria, depois dos meses de carência
   Livros e mensalidade aceitam um valor digitado por mês (state.livro.over).
   Os números ficam em state.livro; o nome do provedor é o mesmo da aba de
   premissas (state.finance.provider).
   ===================================================================== */
function livroBlank() {
  return { id: 'Cenário Livro', fee: 0, qty: 0, unit: 0, ramp: 0, term: 12, first: '', refMonth: 1,
    base: { start: 0, sales: 0, cancels: 0, ticket: 0, grace: 0 }, over: {} };
}
/* roda ao abrir o arquivo, antes das funções auxiliares da análise: usa só o que está aqui */
function normalizeLivro(l) {
  const b = livroBlank(), num = (v, d) => (v === '' || v === null || v === undefined || !isFinite(+v) ? d : +v);
  l = l && typeof l === 'object' ? l : {};
  const over = {};
  Object.keys(l.over && typeof l.over === 'object' ? l.over : {}).forEach(m => {
    const x = l.over[m] || {}, k = {};
    if (x.qty !== undefined) k.qty = num(x.qty, 0);
    if (x.fee !== undefined) k.fee = num(x.fee, 0);
    if (Object.keys(k).length) over[m] = k;
  });
  const base = {};
  Object.keys(b.base).forEach(k => { base[k] = num((l.base || {})[k], 0); });
  return { id: typeof l.id === 'string' ? l.id : b.id, fee: num(l.fee, 0), qty: num(l.qty, 0), unit: num(l.unit, 0), ramp: num(l.ramp, 0),
    term: num(l.term, b.term), first: typeof l.first === 'string' ? l.first : '', refMonth: parseInt(l.refMonth, 10) || 1, base: base, over: over };
}
/* "Zerar valores": modelo do arquivo (ZERO.livro), com o 1º vencimento no dia 20 do mês seguinte */
function livroZeroed() {
  if (!ZERO || !ZERO.livro) return livroBlank();
  const l = normalizeLivro(ZERO.livro);
  l.first = finNext20();
  return l;
}

/* ---------- cálculo ---------- */
function livSchedule() {
  const L = state.livro, b = L.base, ov = L.over || {};
  const n = Math.max(0, Math.min(120, Math.round(fnum(L.term))));
  const Q = Math.max(0, Math.round(fnum(L.qty))), R = Math.max(0, Math.round(fnum(L.ramp))), unit = fnum(L.unit);
  const rows = [];
  let start = fnum(b.start);
  for (let m = 1; m <= n; m++) {
    const o = ov[m] || {};
    const auto = R > 1 && m < R ? Math.floor(Q * m / R) : Q;
    const qty = o.qty !== undefined ? fnum(o.qty) : auto;
    const fee = o.fee !== undefined ? fnum(o.fee) : (m > fnum(b.grace) ? fnum(L.fee) : 0);
    const end = Math.max(0, start + fnum(b.sales) - fnum(b.cancels));
    rows.push({ m, due: addMonths(L.first, m - 1), qty, value: qty * unit, fee, start, end, revenue: end * fnum(b.ticket), o });
    start = end;
  }
  return rows;
}
let livRowsNow = [];
const livAsked = () => fnum(state.livro.qty) > 0;          // a quantidade de livros já foi respondida
function livOvShow(col, r) {
  if (col === 'qty') return r.o.qty === undefined && !livAsked() ? '' : fmtInt(r.qty);
  return r.o.fee === undefined && !r.fee ? '' : 'R$ ' + money(r.fee);             // carência: mensalidade em branco
}

      '<span>Escalonamento: os livros começam na menor quantia e sobem mês a mês até a quantidade total. No cronograma, digitar sobre um valor ajusta só aquele mês; apagar volta ao cálculo.</span></p>' +

/* recalcula e atualiza só as células calculadas (as digitadas não são redesenhadas, para não perder o foco) */
function livRefresh() {
  const body = $('#liv-rows');
  if (!body) return;
  const L = state.livro, rows = livSchedule();
  livRowsNow = rows;
  L.refMonth = Math.min(Math.max(1, L.refMonth), Math.max(1, rows.length));
  const ref = rows[L.refMonth - 1] || null, Q = Math.max(0, Math.round(fnum(L.qty))), asked = livAsked(), out = {};
  out.full = asked ? 'R$ ' + money(Q * fnum(L.unit)) : '';
  out.monthly = 'R$ ' + money(fnum(L.fee) + Q * fnum(L.unit));
  const pay = ref ? ref.value + ref.fee : 0;
  out['ref.qty'] = ref && (asked || ref.o.qty !== undefined) ? fmtInt(ref.qty) : '';
  out['ref.value'] = ref ? 'R$ ' + money(ref.value) : '';
  out['ref.fee'] = ref ? 'R$ ' + money(ref.fee) : '';
  out['ref.pay'] = ref ? 'R$ ' + money(pay) : '';
  out['ind.ref'] = ref ? 'Mês ' + ref.m + (ref.due ? ', ' + fmtDate(ref.due) : '') : '';
  out['ind.pay'] = ref ? 'R$ ' + money(pay) : '';
  out['ind.base'] = ref ? fmtInt(ref.end) : '';
  out['ind.rev'] = ref ? 'R$ ' + money(ref.revenue) : '';
  out['ind.share'] = ref && ref.revenue > 0 ? fmtPct(pay / ref.revenue, 2) : '';
  out['ind.persub'] = ref && ref.end > 0 ? 'R$ ' + money(pay / ref.end) : '';

  if (title) title.textContent = [finName(), L.id || 'Cenário Livro'].filter(Boolean).join(', ');
  document.title = 'Análise financeira' + (finName() ? ' | ' + finName() : '');

  // linhas do cronograma: recria só se a quantidade de meses mudou
  if (body.children.length !== rows.length) body.innerHTML = rows.map(livRowHTML).join('');
  rows.forEach((r, i) => {
    const tr = body.children[i], shown = asked || r.o.qty !== undefined;
    tr.classList.toggle('is-ref', r.m === L.refMonth);
    $('[data-ls="due"]', tr).textContent = fmtDate(r.due);
    $('[data-ls="value"]', tr).textContent = shown ? 'R$ ' + money(r.value) : '';
    $('[data-ls="start"]', tr).textContent = fmtInt(r.start);
    $$('input[data-lov]', tr).forEach(inp => {
      inp.parentNode.classList.toggle('is-over', r.o[inp.dataset.lov] !== undefined);
      if (inp !== document.activeElement) { inp.value = livOvShow(inp.dataset.lov, r); finFit(inp); }
    });
  });
  const clear = $('[data-act="liv-clear-over"]', finEl);
  if (clear) clear.hidden = !Object.keys(L.over || {}).length;

  // opções do mês de referência acompanham o prazo e o 1º vencimento
  const sel = $('#liv-ref');
  if (sel) {
    const sig = rows.map(r => r.due).join('|');
    if (sel.dataset.sig !== sig) {
      sel.dataset.sig = sig;
      sel.innerHTML = rows.length ? rows.map(r => '<option value="' + r.m + '">Mês ' + r.m + (r.due ? ' (' + fmtDate(r.due) + ')' : '') + '</option>').join('') : '<option value="1">Sem meses</option>';
    }
    sel.value = String(L.refMonth);
  }
}

const PDF_CP1252 = { 8364: 128, 8218: 130, 402: 131, 8222: 132, 8230: 133, 8224: 134, 8225: 135, 710: 136, 8240: 137, 352: 138, 8249: 139, 338: 140, 381: 142, 8216: 145, 8217: 146, 8220: 147, 8221: 148, 8226: 149, 8211: 150, 8212: 151, 732: 152, 8482: 153, 353: 154, 8250: 155, 339: 156, 382: 158, 376: 159 };
function pdfCodes(str) {
  const out = [];
  for (const ch of String(str == null ? '' : str)) {
    let c = ch.codePointAt(0);
    if (c === 173) continue;                                    // hífen opcional
    if (c === 160 || c === 8201 || c === 8239 || c < 32) c = 32; // espaços especiais
    else if (c === 8722) c = 150;                               // sinal de menos: meia-risca (a WinAnsi não tem o sinal)
    else if (c >= 127 && c <= 159) c = 63;
    else if (c > 255) c = PDF_CP1252[c] || 63;                  // fora da WinAnsi: "?"
    out.push(c);
  }

}
const pdfTextW = (codes, bold, size) => { const w = PDF_W[bold ? 'b' : 'n']; let s = 0; for (let i = 0; i < codes.length; i++) s += w[codes[i] - 32] || 556; return s * size / 1000; };

const pdfNum = v => String(Math.round(v * 100) / 100);
function pdfHexColor(h) {
  const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(h || '').trim());
  if (!m) return pdfColor(h);
  const x = m[1].length === 3 ? m[1].split('').map(c => c + c).join('') : m[1];
  return [0, 2, 4].map(i => pdfNum(parseInt(x.substr(i, 2), 16) / 255)).join(' ');
}
function pdfColor(css) {
  const m = /rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)(?:[,\s\/]+([\d.]+))?/.exec(css || '');
  if (!m || (m[4] !== undefined && parseFloat(m[4]) === 0)) return null;      // transparente
  return [m[1], m[2], m[3]].map(v => pdfNum(v / 255)).join(' ');
}
function pdfWrap(text, bold, size, maxW) {
  const lines = [];
  let cur = '';
  String(text).split(' ').forEach(word => {
    const next = cur ? cur + ' ' + word : word;
    if (cur && pdfTextW(pdfCodes(next), bold, size) > maxW) { lines.push(cur); cur = word; } else cur = next;
  });
  if (cur) lines.push(cur);
  return lines.map(pdfCodes);
}
/* texto que não cabe na largura: corta e termina com reticências */
function pdfFit(codes, bold, size, maxW) {
  if (pdfTextW(codes, bold, size) <= maxW) return codes;
  const out = codes.slice();
  while (out.length > 1 && pdfTextW(out.concat(133), bold, size) > maxW) out.pop();
  while (out.length > 1 && out[out.length - 1] === 32) out.pop();
  return out.concat(133);

/* monta o arquivo: pages = [{ w, h, ops }] com os comandos de desenho de cada página;
   images = [{ w, h, data }] em JPEG (data: bytes como texto de 1 byte por caractere), usadas como /Im0, /Im1... */
function pdfMake(pages, title, images) {
  images = images || [];
  const parts = [], offs = [];
  let len = 0;
  const push = s => { parts.push(s); len += s.length; };        // só caracteres de 1 byte: tamanho do texto = tamanho em bytes
  const obj = (n, body) => { offs[n] = len; push(n + ' 0 obj\n' + body + '\nendobj\n'); };
  const utf16 = s => { let h = 'FEFF'; for (let i = 0; i < s.length; i++) h += ('000' + s.charCodeAt(i).toString(16)).slice(-4); return '<' + h.toUpperCase() + '>'; };
  const d = new Date(), p2 = n => String(n).padStart(2, '0');
  push('%PDF-1.4\n%' + String.fromCharCode(226, 227, 207, 211) + '\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R /Lang (pt-BR) >>');
  obj(2, '<< /Type /Pages /Count ' + pages.length + ' /Kids [' + pages.map((p, i) => (6 + 2 * i) + ' 0 R').join(' ') + '] >>');
  obj(3, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  obj(4, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  obj(5, '<< /Title ' + utf16(title) + ' /CreationDate (D:' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + p2(d.getHours()) + p2(d.getMinutes()) + p2(d.getSeconds()) + ') >>');
  const imgAt = 6 + 2 * pages.length, xobj = images.length ? ' /XObject << ' + images.map((im, k) => '/Im' + k + ' ' + (imgAt + k) + ' 0 R').join(' ') + ' >>' : '';
  pages.forEach((p, i) => {
    obj(6 + 2 * i, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pdfNum(p.w) + ' ' + pdfNum(p.h) + '] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>' + xobj + ' >> /Contents ' + (7 + 2 * i) + ' 0 R >>');
    obj(7 + 2 * i, '<< /Length ' + p.ops.length + ' >>\nstream\n' + p.ops + '\nendstream');
  });
  images.forEach((im, k) => obj(imgAt + k, '<< /Type /XObject /Subtype /Image /Width ' + im.w + ' /Height ' + im.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + im.data.length + ' >>\nstream\n' + im.data + '\nendstream'));
  const xref = len, count = imgAt + images.length;
  let table = 'xref\n0 ' + count + '\n0000000000 65535 f \n';
  for (let n = 1; n < count; n++) table += ('000000000' + offs[n]).slice(-10) + ' 00000 n \n';
  push(table + 'trailer\n<< /Size ' + count + ' /Root 1 0 R /Info 5 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
  const s = parts.join(''), out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i) & 255;
  return out;
}

/* nome do arquivo: NOME DO CLIENTE-DD-MM-AAAA - GER LUCAS L.pdf (sem os caracteres que o sistema de arquivos recusa) */
function finPdfName(client, when) {
  const d = when || new Date(), p2 = n => String(n).padStart(2, '0');
  const name = String(client || '').replace(/[\\\/:*?"<>|]+/g, ' ').replace(/[\x00-\x1f\x7f]+/g, ' ').replace(/\s+/g, ' ').replace(/^[.~ ]+/, '').replace(/[. ]+$/, '');   // o navegador troca "." e "~" iniciais
  return (name ? name.toLocaleUpperCase('pt-BR') : 'NOME DO CLIENTE') + '-' + p2(d.getDate()) + '-' + p2(d.getMonth() + 1) + '-' + d.getFullYear() + ' - ' + PDF_SIGN + '.pdf';
}

/* mede as tabelas da página na disposição do PDF: cada linha com a altura e, por célula, posição, largura, fundo, texto e alinhamento */
function finPdfMeasure() {
  const sx = window.scrollX, sy = window.scrollY, tables = [], widened = [];
  finEl.classList.add('fin--pdf');
  try {
    $$('table.xl input[data-k="text"]', finEl).forEach(inp => {      // nome comprido digitado: a coluna cresce (até 45% da tabela) para o texto caber
      const cs = getComputedStyle(inp), need = pdfTextW(pdfCodes(inp.value), (parseInt(cs.fontWeight, 10) || 400) >= 600, parseFloat(cs.fontSize) || 12) + 18;
      if (need > 110) { widened.push([inp, inp.style.getPropertyValue('min-width'), inp.style.getPropertyPriority('min-width')]); inp.style.setProperty('min-width', Math.min(324, Math.ceil(need)) + 'px', 'important'); }
    });
    $$('table.xl', finEl).forEach(tb => {
      const T = tb.getBoundingClientRect(), rows = [];
      const cellOf = (el, cap) => {
        const r = el.getBoundingClientRect(), field = el.querySelector('input,select'), src = field || el;
        const cs = getComputedStyle(src), cc = getComputedStyle(el), ta = cs.textAlign;
        const text = el.dataset.pdf !== undefined ? el.dataset.pdf            // célula com desenho (barra, logotipos): o texto equivalente
          : field ? (field.tagName === 'SELECT' ? ((field.options[field.selectedIndex] || {}).text || '') : field.value) : el.textContent;
        return { x: r.left - T.left, w: r.width, h: r.height, cap: !!cap, bg: pdfColor(cc.backgroundColor), text: String(text).replace(/\s+/g, ' ').trim(),
          align: /right|end/.test(ta) ? 'right' : /center/.test(ta) ? 'center' : 'left', bold: (parseInt(cs.fontWeight, 10) || 400) >= 600,
          size: parseFloat(cs.fontSize) || 12, color: pdfColor(cs.color) || '0 0 0', wrap: !field && cc.whiteSpace !== 'nowrap',
          padL: parseFloat(cs.paddingLeft) || 0, padR: field && field.tagName === 'INPUT' && !/right|end/.test(ta) ? parseFloat(cc.paddingRight) || 6 : parseFloat(cs.paddingRight) || 0 };
      };
      if (tb.caption) { const c = cellOf(tb.caption, true); rows.push({ head: true, h: c.h, cells: [c] }); }
      Array.prototype.forEach.call(tb.rows, tr => {
        const cells = Array.prototype.map.call(tr.cells, td => cellOf(td)), h = Math.max.apply(null, cells.map(c => c.h).concat(0));
        if (h > 0) rows.push({ head: tr.parentNode.tagName === 'THEAD', ref: tr.classList.contains('is-ref'), h: h, cells: cells });
      });
      if (rows.length) tables.push({ w: T.width, rows: rows });
    });
  } finally {
    widened.forEach(w => { if (w[1]) w[0].style.setProperty('min-width', w[1], w[2]); else w[0].style.removeProperty('min-width'); });
    finEl.classList.remove('fin--pdf');
    window.scrollTo(sx, sy);
  }
  return tables;
}

/* desenha as tabelas medidas em páginas A4 em pé; tabela que não cabe no resto da folha vai para a seguinte,
   e a que é maior que uma folha (cronograma longo) é dividida por linhas, repetindo título e cabeçalho */
function finPdfBuild(subtitle, fileTitle) {
  const K = 0.75, PW = 595.28, PH = 841.89, ML = 28, MB = 38, TOP1 = 80, TOPN = 54, GAP = 14;   // K: pontos por pixel medido
  const GRAY = '0.357 0.404 0.475', BLUE = '0.122 0.263 0.569', LINE = '0.812 0.839 0.882', RULE = '0.835 0.859 0.898';
  const tables = finPdfMeasure(), pages = [];
  let ops, oy, avail, y;
  const availOf = top => (PH - top - MB) / K;
  const newPage = () => { ops = []; pages.push(ops); oy = pages.length === 1 ? TOP1 : TOPN; avail = availOf(oy); y = 0; };
  const X = px => ML + px * K, Y = px => PH - (oy + px * K);
  const text = (codes, x, yb, bold, size, color) => ops.push('BT /F' + (bold ? 2 : 1) + ' ' + pdfNum(size) + ' Tf ' + color + ' rg ' + pdfNum(x) + ' ' + pdfNum(yb) + ' Td ' + pdfHex(codes) + ' Tj ET');
  function drawCell(c, yTop, h, row, cont) {
    const re = pdfNum(X(c.x)) + ' ' + pdfNum(Y(yTop + h)) + ' ' + pdfNum(c.w * K) + ' ' + pdfNum(h * K) + ' re';
    if (c.bg) ops.push(c.bg + ' rg ' + re + ' f');
    if (!c.cap) ops.push(LINE + ' RG 0.5 w ' + re + ' S');
    if (row.ref && c === row.cells[0]) ops.push('0.118 0.443 0.271 rg ' + pdfNum(X(c.x)) + ' ' + pdfNum(Y(yTop + h)) + ' ' + pdfNum(3 * K) + ' ' + pdfNum(h * K) + ' re f');   // mês de referência
    if (!c.text) return;
    let size = c.size * K;
    const maxW = Math.max(6, (c.w - c.padL - c.padR) * K);
    const label = c.cap && cont ? c.text + ' (continuação)' : c.text;
    let lines = [pdfCodes(label)];
    if (c.wrap && pdfTextW(lines[0], c.bold, size) > maxW) lines = pdfWrap(label, c.bold, size, maxW);
    const widest = Math.max.apply(null, lines.map(l => pdfTextW(l, c.bold, size)));
    if (widest > maxW) { size *= Math.max(0.72, maxW / widest); lines = lines.map(l => pdfFit(l, c.bold, size, maxW)); }   // não coube: reduz o corpo e, no limite, corta
    if (lines.length * size * 1.18 > h * K) size = Math.max(4, h * K / (lines.length * 1.18));
    const lh = size * 1.18, cy = Y(yTop + h / 2);
    lines.forEach((l, i) => {
      const w = pdfTextW(l, c.bold, size), yb = cy + (lines.length - 1) * lh / 2 - i * lh - size * 0.35;
      const x = c.align === 'right' ? X(c.x + c.w - c.padR) - w : c.align === 'center' ? X(c.x + c.padL + (c.w - c.padL - c.padR) / 2) - w / 2 : X(c.x + c.padL);
      text(l, x, yb, c.bold, size, c.color);
    });
  }
  const drawRow = (r, cont) => { r.cells.forEach(c => drawCell(c, y, r.h, r, cont)); y += r.h; };
  newPage();
  const full = availOf(TOPN);
  tables.forEach(t => {
    const head = t.rows.filter(r => r.head), body = t.rows.filter(r => !r.head);
    const sum = a => a.reduce((s, r) => s + r.h, 0), all = sum(t.rows), min = sum(head) + sum(body.slice(0, 3));
    if (y > 0 && y + all > avail && (all <= full || y + min > avail)) newPage();     // não cabe no resto da folha
    head.forEach(r => drawRow(r));
    body.forEach(r => { if (y + r.h > avail) { newPage(); head.forEach(h => drawRow(h, true)); } drawRow(r); });
    y += GAP;
  });
  // cabeçalho e rodapé de cada página
  const d = new Date(), p2 = n => String(n).padStart(2, '0'), date = pdfCodes(p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear());
  const sub = pdfCodes(subtitle || '');
  pages.forEach((pg, i) => {
    ops = [];                                    // o cabeçalho entra no começo da página, para a ordem de leitura do PDF ficar certa
    if (i === 0) {
      text(pdfCodes('Análise financeira'), ML, PH - 46, true, 17, BLUE);
      if (sub.length) text(pdfFit(sub, false, 10.5, PW - 2 * ML), ML, PH - 62, false, 10.5, GRAY);
      text(date, PW - ML - pdfTextW(date, false, 9.5), PH - 46, false, 9.5, GRAY);
      ops.push(RULE + ' RG 0.8 w ' + pdfNum(ML) + ' ' + pdfNum(PH - 71) + ' m ' + pdfNum(PW - ML) + ' ' + pdfNum(PH - 71) + ' l S');
    } else {
      const run = pdfFit(pdfCodes('Análise financeira' + (subtitle ? ' | ' + subtitle : '')), false, 9, PW - 2 * ML - pdfTextW(date, false, 9) - 14);
      text(run, ML, PH - 38, false, 9, GRAY);
      text(date, PW - ML - pdfTextW(date, false, 9), PH - 38, false, 9, GRAY);
      ops.push(RULE + ' RG 0.8 w ' + pdfNum(ML) + ' ' + pdfNum(PH - 45) + ' m ' + pdfNum(PW - ML) + ' ' + pdfNum(PH - 45) + ' l S');
    }
    Array.prototype.unshift.apply(pg, ops);
    ops = pg;
    const foot = pdfCodes('Página ' + (i + 1) + ' de ' + pages.length);
    text(foot, PW - ML - pdfTextW(foot, false, 8), 20, false, 8, GRAY);
  });
  return pdfMake(pages.map(pg => ({ w: PW, h: PH, ops: pg.join('\n') })), fileTitle);
}

/* texto de uma caixa (célula da planilha): quebra de linha, corpo reduzido se não couber, alinhamentos */
function pdfTextOps(ops, t, X, Y, k) {
  let size = t.size * k;
  const maxW = Math.max(4, (t.w - t.padL - t.padR) * k), boxH = t.h * k;
  const layout = () => { let out = []; t.s.split('\n').forEach(p => { const c = pdfCodes(p); out = out.concat(t.wrap && pdfTextW(c, t.bold, size) > maxW ? pdfWrap(p, t.bold, size, maxW) : [c]); }); return out; };
  const widest = ls => Math.max.apply(null, ls.map(l => pdfTextW(l, t.bold, size)).concat(0));
  let lines = layout();
  if (widest(lines) > maxW) { size *= Math.max(0.72, maxW / widest(lines)); lines = layout(); if (widest(lines) > maxW) lines = lines.map(l => pdfFit(l, t.bold, size, maxW)); }
  if (lines.length > 1 && lines.length * size * 1.2 > boxH) size = Math.max(3.5, boxH / (lines.length * 1.2));
  const lh = size * 1.2, top = Y(t.y), bot = Y(t.y + t.h), n = lines.length;
  lines.forEach((l, i) => {
    const w = pdfTextW(l, t.bold, size);
    const yb = t.valign === 'top' ? top - size * 0.95 - i * lh : t.valign === 'middle' ? (top + bot) / 2 + (n - 1) * lh / 2 - i * lh - size * 0.35 : bot + size * 0.3 + (n - 1 - i) * lh;
    const x = t.align === 'right' ? X(t.x + t.w - t.padR) - w : t.align === 'center' ? X(t.x + t.padL + (t.w - t.padL - t.padR) / 2) - w / 2 : X(t.x + t.padL);
    ops.push('BT /F' + (t.bold ? 2 : 1) + ' ' + pdfNum(size) + ' Tf ' + t.color + ' rg ' + pdfNum(x) + ' ' + pdfNum(yb) + ' Td ' + pdfHex(l) + ' Tj ET');
  });
}

/* ---------- PDF da aba Apresentação do simulador ----------
   A aba é desenhada fora da tela, em tamanho real (sem o zoom da tela), e cada célula é medida: posição,
   fundo, bordas, texto, fonte e alinhamento. O logotipo entra como imagem (JPEG) e o gráfico é redesenhado
   em vetor a partir do SVG da página. Tudo numa folha A4 em pé, sem as outras abas. */
const BK_PDF_SHEET = 'Apresentação';
function pdfJpeg(src, w, h) {
  return new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => {
      try {
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(w)); cv.height = Math.max(1, Math.round(h));
        const g = cv.getContext('2d');
        g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);         // JPEG não tem transparência: fundo branco, como na folha
        g.drawImage(im, 0, 0, cv.width, cv.height);
        resolve({ w: cv.width, h: cv.height, data: atob(cv.toDataURL('image/jpeg', 0.92).split(',')[1]) });
      } catch (e) { reject(e); }
    };
    im.onerror = reject;
    im.src = src;
  });
}
function bkPdfMeasure(id) {
  const sh = BOOKS[id].sheets.find(s => s.name === BK_PDF_SHEET);
  if (!sh) return null;
  bkStyles(id);
  const host = document.createElement('div');
  host.className = 'bk-' + id + ' bk-pdfhost';
  host.setAttribute('aria-hidden', 'true');
  host.innerHTML = bkSheetHTML(id, sh, bkGeometry(id, sh), true);
  document.body.appendChild(host);
  try {
    const S = host.querySelector('.bk__sheet').getBoundingClientRect(), cells = [], pics = [], charts = [];
    const rel = r => ({ x: r.left - S.left, y: r.top - S.top, w: r.width, h: r.height });
    host.querySelectorAll('.xs td').forEach(td => {
      const b = rel(td.getBoundingClientRect());
      if (b.w <= 0 || b.h <= 0) return;
      const cs = getComputedStyle(td), it = Object.assign(b, { bg: pdfColor(cs.backgroundColor), borders: [] });
      ['Top', 'Right', 'Bottom', 'Left'].forEach(side => {
        const w = parseFloat(cs['border' + side + 'Width']) || 0, st = cs['border' + side + 'Style'], col = pdfColor(cs['border' + side + 'Color']);
        if (w > 0 && st !== 'none' && st !== 'hidden' && col) it.borders.push({ side: side, w: w, col: col, dash: st === 'dashed' || st === 'dotted' });
      });
      const ov = td.querySelector('.ov'), el = ov || td, text = el.textContent.replace(/ /g, ' ').replace(/\s+$/, '');
      if (text.trim()) {
        const es = getComputedStyle(el), eb = ov ? rel(ov.getBoundingClientRect()) : b, ta = es.textAlign;
        it.text = { s: text, x: eb.x, w: eb.w, y: b.y, h: b.h, size: parseFloat(es.fontSize) || 12, bold: (parseInt(es.fontWeight, 10) || 400) >= 600, color: pdfColor(es.color) || '0 0 0',
          align: /right|end/.test(ta) ? 'right' : /center/.test(ta) ? 'center' : 'left', valign: cs.verticalAlign === 'top' ? 'top' : cs.verticalAlign === 'middle' ? 'middle' : 'bottom',
          wrap: td.classList.contains('w'), padL: ov ? 0 : parseFloat(cs.paddingLeft) || 0, padR: ov ? 0 : parseFloat(cs.paddingRight) || 0 };
      }
      if (it.bg || it.borders.length || it.text) cells.push(it);
    });
    host.querySelectorAll('img.bk__pic').forEach(img => pics.push(Object.assign(rel(img.getBoundingClientRect()), { src: img.getAttribute('src') })));
    host.querySelectorAll('.bk__chart').forEach(div => {
      const cs = getComputedStyle(div), svg = div.querySelector('svg'), items = [];
      const c = Object.assign(rel(div.getBoundingClientRect()), { bg: pdfColor(cs.backgroundColor), border: pdfColor(cs.borderTopColor), bw: parseFloat(cs.borderTopWidth) || 0, items: items, ox: 0, oy: 0, k: 1 });
      if (svg) {
        const sr = rel(svg.getBoundingClientRect()), vb = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
        c.ox = sr.x; c.oy = sr.y; c.k = vb[2] > 0 ? sr.w / vb[2] : 1;
        svg.querySelectorAll('rect,line,text,polyline,circle').forEach(n => {
          const a = key => n.getAttribute(key), f = key => parseFloat(a(key)) || 0, tag = n.tagName.toLowerCase();
          if (tag === 'rect') items.push({ t: 'rect', x: f('x'), y: f('y'), w: f('width'), h: f('height'), fill: a('fill') });
          else if (tag === 'line') items.push({ t: 'line', x1: f('x1'), y1: f('y1'), x2: f('x2'), y2: f('y2'), stroke: a('stroke'), dash: a('stroke-dasharray') });
          else if (tag === 'polyline') items.push({ t: 'poly', pts: (a('points') || '').trim().split(/\s+/).map(p => p.split(',').map(Number)), stroke: a('stroke'), sw: f('stroke-width') || 1 });
          else if (tag === 'circle') items.push({ t: 'circle', x: f('cx'), y: f('cy'), r: f('r'), fill: a('fill') });
          else if (tag === 'text') items.push({ t: 'text', x: f('x'), y: f('y'), s: n.textContent, size: f('font-size') || 11, bold: /^(700|bold)$/.test(a('font-weight') || ''), fill: a('fill') || '#000', anchor: a('text-anchor') || 'start' });
        });
      }
      charts.push(c);
    });
    return { cells: cells, pics: pics, charts: charts };
  } finally {
    host.remove();
  }
}
async function bkPdfBuild(id, fileTitle) {
  const m = bkPdfMeasure(id);
  if (!m) throw new Error('aba ' + BK_PDF_SHEET + ' ausente');
  const PW = 595.28, PH = 841.89, M = 28;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const grow = b => { x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); };
  m.cells.forEach(c => { if (c.bg || c.borders.length) grow(c); if (c.text) grow(c.text); });
  m.pics.forEach(grow); m.charts.forEach(grow);
  if (!(x1 > x0 && y1 > y0)) throw new Error('aba vazia');
  const k = Math.min((PW - 2 * M) / (x1 - x0), (PH - 2 * M) / (y1 - y0)), ox = (PW - (x1 - x0) * k) / 2;   // a aba inteira numa folha, centralizada
  const X = px => ox + (px - x0) * k, Y = py => PH - (M + (py - y0) * k);
  const box = (x, y, w, h) => pdfNum(X(x)) + ' ' + pdfNum(Y(y + h)) + ' ' + pdfNum(w * k) + ' ' + pdfNum(h * k) + ' re';
  const ops = [], images = [];
  m.cells.forEach(c => { if (c.bg) ops.push(c.bg + ' rg ' + box(c.x, c.y, c.w, c.h) + ' f'); });
  m.cells.forEach(c => c.borders.forEach(b => {
    const e = { Top: [c.x, c.y, c.x + c.w, c.y], Right: [c.x + c.w, c.y, c.x + c.w, c.y + c.h], Bottom: [c.x, c.y + c.h, c.x + c.w, c.y + c.h], Left: [c.x, c.y, c.x, c.y + c.h] }[b.side];
    ops.push(b.col + ' RG ' + pdfNum(Math.max(0.3, b.w * k)) + ' w ' + (b.dash ? '[1.5 1.2] 0 d ' : '[] 0 d ') + pdfNum(X(e[0])) + ' ' + pdfNum(Y(e[1])) + ' m ' + pdfNum(X(e[2])) + ' ' + pdfNum(Y(e[3])) + ' l S');
  }));
  ops.push('[] 0 d');
  m.cells.forEach(c => { if (c.text) pdfTextOps(ops, c.text, X, Y, k); });
  for (const p of m.pics) {
    try {
      const im = await pdfJpeg(p.src, p.w * 4, p.h * 4);
      ops.push('q ' + pdfNum(p.w * k) + ' 0 0 ' + pdfNum(p.h * k) + ' ' + pdfNum(X(p.x)) + ' ' + pdfNum(Y(p.y + p.h)) + ' cm /Im' + images.length + ' Do Q');
      images.push(im);
    } catch (e) { /* imagem que o navegador não deixa converter: o PDF sai sem ela */ }
  }
  m.charts.forEach(c => {
    if (c.bg) ops.push(c.bg + ' rg ' + box(c.x, c.y, c.w, c.h) + ' f');
    if (c.border && c.bw) ops.push(c.border + ' RG ' + pdfNum(Math.max(0.3, c.bw * k)) + ' w ' + box(c.x, c.y, c.w, c.h) + ' S');
    const cx = v => X(c.ox + v * c.k), cy = v => Y(c.oy + v * c.k), u = c.k * k;
    c.items.forEach(n => {
      if (n.t === 'rect' && n.fill && n.fill !== 'none') ops.push(pdfHexColor(n.fill) + ' rg ' + pdfNum(cx(n.x)) + ' ' + pdfNum(cy(n.y + n.h)) + ' ' + pdfNum(n.w * u) + ' ' + pdfNum(n.h * u) + ' re f');
      else if (n.t === 'line') {
        const d = (n.dash || '').split(/[\s,]+/).filter(Boolean).map(v => pdfNum(+v * u));
        ops.push((pdfHexColor(n.stroke) || '0 0 0') + ' RG ' + pdfNum(Math.max(0.25, u)) + ' w [' + d.join(' ') + '] 0 d ' + pdfNum(cx(n.x1)) + ' ' + pdfNum(cy(n.y1)) + ' m ' + pdfNum(cx(n.x2)) + ' ' + pdfNum(cy(n.y2)) + ' l S [] 0 d');
      } else if (n.t === 'poly' && n.pts.length > 1) ops.push((pdfHexColor(n.stroke) || '0 0 0') + ' RG ' + pdfNum(n.sw * u) + ' w ' + n.pts.map((q, i) => pdfNum(cx(q[0])) + ' ' + pdfNum(cy(q[1])) + (i ? ' l' : ' m')).join(' ') + ' S');
      else if (n.t === 'circle') {
        const r = n.r * u, x = cx(n.x), y = cy(n.y), q = r * 0.5523;
        ops.push((pdfHexColor(n.fill) || '0 0 0') + ' rg ' + [x + r, y, 'm', x + r, y + q, x + q, y + r, x, y + r, 'c', x - q, y + r, x - r, y + q, x - r, y, 'c', x - r, y - q, x - q, y - r, x, y - r, 'c', x + q, y - r, x + r, y - q, x + r, y, 'c'].map(v => typeof v === 'number' ? pdfNum(v) : v).join(' ') + ' f');
      } else if (n.t === 'text' && n.s.trim()) {
        const codes = pdfCodes(n.s), size = n.size * u, w = pdfTextW(codes, n.bold, size);
        const x = cx(n.x) - (n.anchor === 'end' ? w : n.anchor === 'middle' ? w / 2 : 0);
        ops.push('BT /F' + (n.bold ? 2 : 1) + ' ' + pdfNum(size) + ' Tf ' + (pdfHexColor(n.fill) || '0 0 0') + ' rg ' + pdfNum(x) + ' ' + pdfNum(cy(n.y)) + ' Td ' + pdfHex(codes) + ' Tj ET');
      }
    });
  });
  return pdfMake([{ w: PW, h: PH, ops: ops.join('\n') }], fileTitle, images);
}

/* ---------- botão PDF e pergunta do nome do cliente ----------
   Premissas e Cenário Livro: o nome é o "Nome do provedor" da análise (state.finance.provider).
   Simulador: o PDF leva só a aba Apresentação, e o nome vai para "Nome da empresa" (Preencher!C7),

const BK_NAME_CELL = ['Preencher', 'C7'];
const finPdfBox = () => $('#fin-pdf', finEl);
const finPdfBook = () => (BOOKS[ui.finTab] ? ui.finTab : null);
function finPdfClient() {
  const id = finPdfBook();
  if (id) { const v = bookOf(id).value(BK_NAME_CELL[0], BK_NAME_CELL[1]); if (typeof v === 'string' && v.trim()) return v.trim(); }

function finPdfPreview() {

function finPdfToggle(open) {

async function finPdfDownload() {
  const box = finPdfBox();
  if (!box || box.dataset.busy) return;
  const inp = $('#fin-pdf-name', box), client = inp.value.replace(/\s+/g, ' ').trim();
  if (!client) { inp.setAttribute('aria-invalid', 'true'); inp.focus(); toast('Digite o nome do cliente para gerar o PDF.'); return; }

    if (id) {
      const bk = bookOf(id), sh = BOOKS[id].sheets.find(s => s.name === BK_NAME_CELL[0]), cell = sh && sh.cells[BK_NAME_CELL[1]];
      if (cell && bk.value(BK_NAME_CELL[0], BK_NAME_CELL[1]) !== client) {

/* nas premissas e no Cenário Livro, o nome digitado é o mesmo "Nome do provedor" da página: aparece no PDF e no nome do arquivo */

/* =====================================================================
   PLANILHAS DENTRO DA ANÁLISE FINANCEIRA (hoje, a aba "Simulador")
   Os modelos convertidos do Excel ficam no bloco <script id="vitrine-books"> (lido em BOOKS, no início do app).

const BOOK_IDS = Object.keys(BOOKS).filter(id => BOOKS[id] && Array.isArray(BOOKS[id].sheets) && BOOKS[id].sheets.length);
const bookCache = {};
function bookOf(id) {
  if (!BOOKS[id]) return null;
  if (!state.books[id] || typeof state.books[id] !== 'object') state.books[id] = {};
  if (!bookCache[id] || bookCache[id].edits !== state.books[id]) bookCache[id] = createBook(BOOKS[id], state.books[id]);
  return bookCache[id];
}
ui.bk = {};
const bkView = id => ui.bk[id] || (ui.bk[id] = { sheet: Math.min(BOOKS[id].active || 0, BOOKS[id].sheets.length - 1), zoom: null });
const bkSheet = id => BOOKS[id].sheets[bkView(id).sheet] || BOOKS[id].sheets[0];
const BK_FONTS = { Calibri: "Calibri,Carlito,'Segoe UI',system-ui,Arial,sans-serif", Poppins: "Poppins,Outfit,'Segoe UI',system-ui,Arial,sans-serif" };   // sem aspas duplas: vai dentro de style=""

/* estilos das células viram classes (.bk-id .sN), criadas uma vez por planilha */
function bkStyles(id) {

  const el = document.createElement('style');
  el.id = 'bk-css-' + id;
  el.textContent = BOOKS[id].styles.map((s, i) => (i && s[0] ? '.bk-' + id + ' .s' + i + '{' + s[0] + '}' : '')).join('');

/* ---------- uma célula ---------- */
function bkCellParts(id, sh, r, c, cell, geo) {
  const bk = bookOf(id), model = BOOKS[id], a = bk.A1(r, c);
  const st = model.styles[cell.s || 0] || ['', 0], flags = st[1];
  const cls = [];
  if (cell.s) cls.push('s' + cell.s);
  if (flags & 1) cls.push('w');
  if (geo.grid && st[0].indexOf('background:') < 0) cls.push('g');
  let inner = '', cf = bk.cfOf(sh.name, r, c);
  if (cell.i) {
    cls.push('in');
    const left = c > 1 ? sh.cells[bk.A1(r, c - 1)] : null;        // o rótulo da linha (célula à esquerda) descreve a entrada para leitores de tela
    const kind = bk.kindOf(sh.name, a), label = esc((left && typeof left.v === 'string' && left.v.trim() ? left.v.trim() + ', ' : '') + 'célula ' + a);
    const v = bk.value(sh.name, a);
    if (typeof v === 'number' && !(flags & 2)) cls.push('tn');
    if (kind === 'list') {
      const rule = bk.ruleOf(sh.name, a), cur = v === null ? '' : bk.editText(sh.name, a);
      const opts = rule.l.slice();
      if (cur !== '' && opts.indexOf(cur) < 0) opts.unshift(cur);
      inner = '<select data-cell="' + a + '" aria-label="' + label + '">' + (cell.v === undefined || cur === '' ? '<option value=""' + (cur === '' ? ' selected' : '') + '>(vazio)</option>' : '') +
        opts.map(o => '<option' + (o === cur ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>';
    } else {
      inner = '<input type="text" autocomplete="off" data-cell="' + a + '"' + (kind === 'num' || kind === 'pct' ? ' inputmode="decimal"' : '') + ' value="' + esc(bk.text(sh.name, a).t) + '" aria-label="' + label + '">';
    }
    return { cls: cls.join(' '), inner: inner, style: cf };
  }
  const v = bk.value(sh.name, a), tx = bk.format(v, model.fmts[cell.n || 0]);
  if (!(flags & 2)) { if (typeof v === 'number') cls.push('tn'); else if (typeof v === 'boolean' || bk.isErr(v)) cls.push('tc'); }
  let text = esc(tx.t);
  const link = cell.f !== undefined ? bk.linkOf(sh.name, a) : null;
  if (link && text) text = link.charAt(0) === '#' ? '<button type="button" class="bk__lk" data-act="bk-goto" data-ref="' + esc(link) + '">' + text + '</button>' : /^https?:\/\//i.test(link) ? '<a href="' + esc(link) + '" target="_blank" rel="noopener">' + text + '</a>' : text;
  const extra = geo.over[a], back = geo.overL[a];
  if (extra && !(flags & 1)) { cls.push('ovf'); inner = '<div class="ov" style="width:' + extra + 'px">' + text + '</div>'; }
  else if (back && typeof v === 'string') { cls.push('ovf'); inner = '<div class="ov ov--l" style="width:' + back[0] + 'px;margin-left:-' + back[1] + 'px">' + text + '</div>'; }
  else inner = text;
  if (tx.c) cf = (cf ? cf + ';' : '') + 'color:' + tx.c;
  return { cls: cls.join(' '), inner: inner, style: cf };
}

/* medidas da aba: posições, mesclagens e até onde o texto pode avançar sobre células vazias */
function bkGeometry(id, sh) {
  const bk = bookOf(id), model = BOOKS[id], nr = sh.rows.length, nc = sh.cols.length;
  const span = {}, covered = {};
  sh.merges.forEach(m => {
    let cs = 0;
    for (let c = m[1]; c <= m[3]; c++) if (sh.cols[c - 1]) cs++;
    let rs = 0;
    for (let r = m[0]; r <= m[2]; r++) if (sh.rows[r - 1]) rs++;
    span[bk.A1(m[0], m[1])] = [rs, cs];
    for (let r = m[0]; r <= m[2]; r++) for (let c = m[1]; c <= m[3]; c++) if (r !== m[0] || c !== m[1]) covered[bk.A1(r, c)] = true;
  });
  const over = {}, overL = {};
  for (let r = 1; r <= nr; r++) {
    for (let c = 1; c <= nc; c++) {
      const a = bk.A1(r, c), cell = sh.cells[a];
      if (!cell || (cell.v === undefined && cell.f === undefined) || cell.i || span[a] || covered[a]) continue;
      const st = model.styles[cell.s || 0] || ['', 0];
      if (st[1] & 1) continue;
      if ((st[1] & 2) && st[0].indexOf('text-align:right') >= 0) {
        let back = 0;
        for (let k = c - 1; k >= 1; k--) {
          const b = bk.A1(r, k), pv = sh.cells[b];
          if (covered[b] || span[b] || (pv && (pv.v !== undefined || pv.f !== undefined || pv.i))) break;
          back += sh.cols[k - 1];
        }
        if (back > 0) overL[a] = [sh.cols[c - 1] + back - 8, back];
        continue;
      }
      if ((st[1] & 2) && st[0].indexOf('text-align:left') < 0) continue;
      let w = sh.cols[c - 1], more = 0;
      for (let k = c + 1; k <= nc; k++) {
        const b = bk.A1(r, k), nx = sh.cells[b];
        if (covered[b] || span[b] || (nx && (nx.v !== undefined || nx.f !== undefined || nx.i))) break;
        more += sh.cols[k - 1];
      }
      if (more > 0) over[a] = w + more - 8;
    }
  }
  return { span: span, covered: covered, over: over, overL: overL, grid: !!sh.grid, width: sh.cols.reduce((t, w) => t + w, 0) };
}

/* ---------- gráficos (SVG) ---------- */
function bkNice(min, max, from0) {
  if (!(max > min)) { max = min + 1; }
  if (from0 && min > 0) min = 0;
  const raw = (max - min) / 6, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
  const lo = from0 && min >= 0 ? 0 : Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.abs(v) < step / 1e6 ? 0 : v);
  return { lo: lo, hi: ticks[ticks.length - 1], ticks: ticks };
}
function bkChartSVG(id, sh, ch) {
  const bk = bookOf(id), W = ch.w, H = ch.h;
  const cats = ch.ser.length && ch.ser[0].cat ? bk.rangeValues(ch.ser[0].cat, sh.name).map(v => (v === null ? '' : bk.format(v, 'General').t)) : [];
  const series = ch.ser.map(s => ({ name: s.name || (s.nameRef ? String(bk.rangeValues(s.nameRef, sh.name)[0] || '') : ''), color: s.color || '#214694', vals: s.val ? bk.rangeValues(s.val, sh.name) : [] }));
  const nums = [];
  series.forEach(s => s.vals.forEach(v => { if (typeof v === 'number') nums.push(v); }));
  const head = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(ch.title || 'Gráfico') + '" font-family="inherit">' +
    (ch.title ? '<text x="16" y="26" font-size="13" font-weight="700" fill="#101232">' + esc(ch.title) + '</text>' : '');
  if (!nums.length) return head + '<text x="' + W / 2 + '" y="' + H / 2 + '" text-anchor="middle" font-size="13" fill="#6B7280">Sem valores para o gráfico. Complete os dados em Preencher.</text></svg>';
  const bar = ch.type === 'bar';
  const sc = bkNice(Math.min.apply(null, nums), Math.max.apply(null, nums), bar);
  const label = v => bk.format(v, ch.fmt || 'General').t;
  const left = 16 + Math.max.apply(null, sc.ticks.map(t => label(t).length)) * 6.4 + 8, right = 18, top = 46, bottom = (ch.legend ? 58 : 34);
  const pw = W - left - right, ph = H - top - bottom, y = v => top + ph - (v - sc.lo) / (sc.hi - sc.lo) * ph;
  let out = head;
  sc.ticks.forEach(t => {
    out += '<line x1="' + left + '" x2="' + (W - right) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="#D9D9D9" stroke-dasharray="4 3"/>' +
      '<text x="' + (left - 6) + '" y="' + (y(t) + 4) + '" text-anchor="end" font-size="11" fill="#333">' + esc(label(t)) + '</text>';
  });
  const n = Math.max(cats.length, 1), band = pw / n;
  cats.forEach((c, i) => { out += '<text x="' + (left + band * (i + .5)) + '" y="' + (top + ph + 18) + '" text-anchor="middle" font-size="11.5" fill="#333">' + esc(c) + '</text>'; });
  if (bar) {
    const k = series.length, bw = Math.min(70, band * .7 / k);
    series.forEach((s, j) => s.vals.forEach((v, i) => {
      if (typeof v !== 'number') return;
      const x = left + band * (i + .5) - (k * bw) / 2 + j * bw, y0 = y(Math.max(0, sc.lo)), y1 = y(v);
      out += '<rect x="' + x.toFixed(1) + '" y="' + Math.min(y0, y1).toFixed(1) + '" width="' + (bw - 3).toFixed(1) + '" height="' + Math.abs(y0 - y1).toFixed(1) + '" fill="' + esc(s.color) + '"><title>' + esc((s.name ? s.name + ': ' : '') + label(v)) + '</title></rect>';
    }));
  } else {
    series.forEach(s => {
      const pts = [];
      s.vals.forEach((v, i) => { if (typeof v === 'number') pts.push([left + band * (i + .5), y(v), v]); });
      out += '<polyline fill="none" stroke="' + esc(s.color) + '" stroke-width="2.2" points="' + pts.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ') + '"/>' +
        pts.map(q => '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="3.5" fill="' + esc(s.color) + '"><title>' + esc(label(q[2])) + '</title></circle>').join('');
    });
  }
  if (ch.legend) {
    let x = left;
    series.forEach(s => { out += '<rect x="' + x + '" y="' + (H - 24) + '" width="11" height="11" fill="' + esc(s.color) + '"/><text x="' + (x + 16) + '" y="' + (H - 14) + '" font-size="11.5" fill="#333">' + esc(s.name) + '</text>'; x += 34 + s.name.length * 6.6; });
  }
  return out + '</svg>';
}

/* ---------- desenho da aba ---------- */
/* a folha (tabela, imagens e gráficos) de uma aba qualquer; charts = true já desenha os gráficos (usado no PDF) */
function bkSheetHTML(id, sh, geo, charts) {
  const bk = bookOf(id), model = BOOKS[id], rowsHTML = [];
  for (let r = 1; r <= sh.rows.length; r++) {
    if (!sh.rows[r - 1]) continue;
    let tds = '';
    for (let c = 1; c <= sh.cols.length; c++) {
      if (!sh.cols[c - 1]) continue;
      const a = bk.A1(r, c);
      if (geo.covered[a]) continue;
      const cell = sh.cells[a], sp = geo.span[a];
      const spans = sp ? (sp[0] > 1 ? ' rowspan="' + sp[0] + '"' : '') + (sp[1] > 1 ? ' colspan="' + sp[1] + '"' : '') : '';
      if (!cell) { tds += '<td' + spans + (geo.grid ? ' class="g"' : '') + '></td>'; continue; }
      const p = bkCellParts(id, sh, r, c, cell, geo);
      tds += '<td data-a="' + a + '"' + spans + (p.cls ? ' class="' + p.cls + '"' : '') + (p.style ? ' style="' + esc(p.style) + '"' : '') + '>' + p.inner + '</td>';
    }
    rowsHTML.push('<tr style="height:' + sh.rows[r - 1] + 'px">' + tds + '</tr>');
  }
  return '<div class="bk__sheet" style="width:' + geo.width + 'px;--pz:' + Math.min(1, 1040 / geo.width).toFixed(3) + '">' +
      '<table class="xs" style="width:' + geo.width + 'px;--xfont:' + (BK_FONTS[model.font] || BK_FONTS.Calibri) + ';font-family:var(--xfont);font-size:' + model.size + 'px">' +
      '<colgroup>' + sh.cols.filter(w => w).map(w => '<col style="width:' + w + 'px">').join('') + '</colgroup><tbody>' + rowsHTML.join('') + '</tbody></table>' +
      (sh.pics || []).map(p => '<img class="bk__pic" alt="" src="' + esc(model.media[p.m] || '') + '" style="left:' + p.x + 'px;top:' + p.y + 'px;width:' + p.w + 'px;height:' + p.h + 'px">').join('') +
      (sh.charts || []).map((c, i) => '<div class="bk__chart" data-chart="' + i + '" style="left:' + c.x + 'px;top:' + c.y + 'px;width:' + c.w + 'px;height:' + c.h + 'px">' + (charts ? bkChartSVG(id, sh, c) : '') + '</div>').join('') +
    '</div>';
}
function renderBook(id) {
  const body = $('#fin-body'), bk = bookOf(id), model = BOOKS[id];
  if (!body || !bk) return;
  bkStyles(id);
  const view = bkView(id), sh = bkSheet(id), geo = bkGeometry(id, sh);
  view.geo = geo;
  const nIn = Object.keys(sh.cells).filter(a => sh.cells[a].i).length, nEd = Object.keys(state.books[id]).length;
  body.innerHTML = '<div class="bk bk-' + id + '">' +
    '<div class="bk__bar"><div class="bk__sheets" role="tablist" aria-label="Abas da planilha">' + model.sheets.map((s, i) =>
        '<button type="button" role="tab" data-act="bk-sheet" data-i="' + i + '" aria-selected="' + (i === view.sheet) + '">' + esc(s.name) + '</button>').join('') + '</div>' +
      '<div class="bk__zoom"><button type="button" class="ebtn ebtn--sm ebtn--ico" data-act="bk-zoom" data-d="-1" aria-label="Diminuir o zoom" title="Diminuir o zoom">−</button><span class="bk__zl" aria-live="polite"></span>' +
        '<button type="button" class="ebtn ebtn--sm ebtn--ico" data-act="bk-zoom" data-d="1" aria-label="Aumentar o zoom" title="Aumentar o zoom">+</button>' +
        '<button type="button" class="ebtn ebtn--sm" data-act="bk-zoom" data-d="0" title="Ajustar a planilha à largura da tela">Ajustar</button></div></div>' +
    '<p class="bk__hint"><span><i class="bk__sw"></i>' + (nIn ? 'Células com contorno azul: clique para digitar. O restante é calculado.' : 'Esta aba não tem células de entrada: os valores vêm das outras abas.') + '</span>' +
      (nEd ? '<span>' + nEd + ' ' + plural(nEd, 'valor alterado', 'valores alterados') + ' em relação à planilha original.</span>' : '') + '</p>' +
    '<div class="bk__scroll" tabindex="-1">' + bkSheetHTML(id, sh, geo) + '</div></div>';
  bkCharts(id);
  bkZoom(id);
}
function bkCharts(id) {
  const sh = bkSheet(id);
  $$('.bk__chart', finEl).forEach(el => { const ch = (sh.charts || [])[+el.dataset.chart]; if (ch) el.innerHTML = bkChartSVG(id, sh, ch); });
}
/* recalcula e atualiza só o que muda (fórmulas, formatação condicional e gráficos), sem recriar as células de entrada */
function bkRefresh(id) {
  const bk = bookOf(id), sh = bkSheet(id), geo = bkView(id).geo;
  if (!geo) return;
  $$('.xs td[data-a]', finEl).forEach(td => {
    const a = td.dataset.a, cell = sh.cells[a], q = bk.parseA1(a);
    if (!cell || !q) return;
    if (cell.i) {
      const cf = bk.cfOf(sh.name, q.r, q.c);
      if (td.getAttribute('style') !== (cf || null)) { if (cf) td.setAttribute('style', cf); else td.removeAttribute('style'); }
      const el = td.firstElementChild, v = bk.value(sh.name, a), st = BOOKS[id].styles[cell.s || 0] || ['', 0];
      td.classList.toggle('tn', typeof v === 'number' && !(st[1] & 2));
      if (el && el.tagName === 'INPUT' && el !== document.activeElement) el.value = bk.text(sh.name, a).t;
      return;
    }
    if (cell.f === undefined && !sh.cf) return;
    const p = bkCellParts(id, sh, q.r, q.c, cell, geo);
    if (td.className !== p.cls) td.className = p.cls;
    if ((td.getAttribute('style') || '') !== p.style) { if (p.style) td.setAttribute('style', p.style); else td.removeAttribute('style'); }
    if (cell.f !== undefined && td.innerHTML !== p.inner) td.innerHTML = p.inner;
  });
  bkCharts(id);
  const hint = $('.bk__hint', finEl), nEd = Object.keys(state.books[id]).length;
  if (hint) { const sp = hint.children[1]; const txt = nEd ? nEd + ' ' + plural(nEd, 'valor alterado', 'valores alterados') + ' em relação à planilha original.' : ''; if (sp) sp.textContent = txt; else if (txt) hint.insertAdjacentHTML('beforeend', '<span>' + txt + '</span>'); }
}
function bkZoom(id) {
  const view = bkView(id), sc = $('.bk__scroll', finEl), el = $('.bk__sheet', finEl);
  if (!sc || !el || !view.geo) return;
  const fit = Math.max(.7, Math.min(1, (sc.clientWidth - 2) / (view.geo.width + 2)));     // abaixo de 70% o texto fica pequeno demais: a planilha passa a rolar para os lados
  const z = view.zoom || fit;
  el.style.zoom = z;
  const zl = $('.bk__zl', finEl);
  if (zl) zl.textContent = Math.round(z * 100) + '%';
}
window.addEventListener('resize', () => { if (document.body.classList.contains('view-fin') && BOOKS[ui.finTab]) bkZoom(ui.finTab); });

/* ---------- digitação ---------- */
function bkCommit(id, el, text) {
  const bk = bookOf(id), sh = bkSheet(id), a = el.dataset.cell, cell = sh.cells[a];
  const res = bk.parseInput(sh.name, a, text);
  if (!res.ok) { toast(res.msg); return false; }
  const orig = cell.v === undefined ? null : cell.v;
  if (res.v === orig) bk.dropEdit(sh.name, a); else bk.setEdit(sh.name, a, res.v);
  saveDraftSoon();
  bkRefresh(id);
  return true;
}
finEl.addEventListener('focusin', e => {
  const el = e.target;
  if (!el.matches('input[data-cell]') || !BOOKS[ui.finTab]) return;
  el.dataset.raw = bookOf(ui.finTab).editText(bkSheet(ui.finTab).name, el.dataset.cell);
  el.value = el.dataset.raw;
  el.select();
});
finEl.addEventListener('focusout', e => {
  const el = e.target, id = ui.finTab;
  if (!el.matches('input[data-cell]') || !BOOKS[id]) return;
  if (el.value.trim() !== (el.dataset.raw || '').trim()) bkCommit(id, el, el.value);
  el.value = bookOf(id).text(bkSheet(id).name, el.dataset.cell).t;
});
finEl.addEventListener('change', e => {
  const el = e.target, id = ui.finTab;
  if (!el.matches('select[data-cell]') || !BOOKS[id]) return;
  if (!bkCommit(id, el, el.value)) el.value = bookOf(id).editText(bkSheet(id).name, el.dataset.cell);
});
finEl.addEventListener('keydown', e => {
  const el = e.target;
  if (!el.matches('input[data-cell]')) return;
  if (e.key === 'Escape') { el.value = el.dataset.raw || ''; el.blur(); return; }
  if (e.key !== 'Enter' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const col = el.dataset.cell.replace(/\d+/g, ''), all = $$('[data-cell]', finEl).filter(x => x.dataset.cell.replace(/\d+/g, '') === col);
  const next = all[all.indexOf(el) + (e.key === 'ArrowUp' || (e.key === 'Enter' && e.shiftKey) ? -1 : 1)];
  e.preventDefault();
  if (next) next.focus(); else el.blur();
});

function bkCSV(id) {
  const bk = bookOf(id), sh = bkSheet(id), L = [];
  const cell = v => { v = String(v == null ? '' : v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  for (let r = 1; r <= sh.rows.length; r++) {
    const row = [];
    for (let c = 1; c <= sh.cols.length; c++) { const a = bk.A1(r, c); row.push(sh.cells[a] ? cell(bk.text(sh.name, a).t) : ''); }
    L.push(row.join(';').replace(/;+$/, ''));
  }
  while (L.length && !L[L.length - 1]) L.pop();
  return String.fromCharCode(0xFEFF) + L.join('\r\n') + '\r\n';
}
Object.assign(ACTIONS, {
  'bk-sheet': d => { const id = ui.finTab; if (!BOOKS[id]) return; bkView(id).sheet = +d.i; renderBook(id); },
  'bk-zoom': d => {
    const id = ui.finTab, view = bkView(id), zl = $('.bk__zl', finEl);
    const cur = view.zoom || (zl ? parseInt(zl.textContent, 10) / 100 : 1);
    view.zoom = +d.d === 0 ? null : Math.max(.4, Math.min(2, Math.round((cur + (+d.d) * .1) * 10) / 10));
    bkZoom(id);
  },
  'bk-goto': (d, el) => {
    const id = ui.finTab, m = /^#(?:'((?:[^']|'')+)'|([^!]+))!\$?([A-Z]{1,3})\$?(\d+)/.exec(d.ref || '');
    if (!m || !BOOKS[id]) return;
    const name = m[1] !== undefined ? m[1].replace(/''/g, "'") : m[2], i = BOOKS[id].sheets.findIndex(s => s.name === name);
    if (i < 0) { toast('A aba “' + name + '” não está nesta planilha.'); return; }
    bkView(id).sheet = i;
    renderBook(id);
    const td = $('.xs td[data-a="' + m[3] + m[4] + '"]', finEl);
    if (td) { td.scrollIntoView({ block: 'center', inline: 'nearest' }); td.classList.add('is-flash'); setTimeout(() => td.classList.remove('is-flash'), 1700); }
  },
  'bk-csv': () => {
    const id = ui.finTab, name = slug(BOOKS[id].title + '-' + bkSheet(id).name) + '.csv';
    const url = URL.createObjectURL(new Blob([bkCSV(id)], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Arquivo ' + name + ' baixado, com os valores da aba “' + bkSheet(id).name + '”.');
  }
});

/* ---------- início ---------- */
applyTheme();
renderStage();
syncView();
})();</script>
